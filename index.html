<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The Daily Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{--n:#16324F;--p:#F7F5EE;--g:#4B5F74;--a:#A8481A}
*{box-sizing:border-box}
body{margin:0;background-color:#F2F0E8;background-image:linear-gradient(#DDE3E6 1px,transparent 1px),linear-gradient(90deg,#DDE3E6 1px,transparent 1px);background-size:20px 20px;font-family:'IBM Plex Sans',sans-serif;color:var(--n);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.sheet{max-width:460px;margin:12px auto;border:2px solid var(--n);background:var(--p);padding:20px 16px 16px;display:flex;flex-direction:column;gap:32px}
@media(max-width:484px){.sheet{margin:12px}}
.mono{font-family:'IBM Plex Mono',monospace}
.cond{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;text-transform:uppercase}
.col{display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.name{font-size:22px;letter-spacing:.04em}
button,a.btn{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;text-transform:uppercase;cursor:pointer;border-radius:0;border:2px solid var(--n);background:var(--p);color:var(--n);min-height:44px;padding:4px 14px;-webkit-appearance:none;appearance:none}
button.on,button.fill,a.btn{background:var(--n);color:var(--p)}
a.btn{display:inline-flex;align-items:center;text-decoration:none;align-self:flex-start}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--n)}
.seg button{border:none;border-left:1px solid var(--n);padding:0 2px;font-size:12px}
.seg button:first-child{border-left:none}
.kick{font-size:12px;color:var(--g);text-transform:uppercase}
h1{margin:0;font-size:42px;line-height:1;letter-spacing:.01em}
h2{margin:0;font-size:26px;line-height:1.1}
.hook{font-size:19px;line-height:1.4;margin-top:4px}
.note{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;letter-spacing:.06em;color:var(--a);text-transform:uppercase}
.fig{border:1px solid var(--n);background:#FBFAF5;padding:8px}
.fig img,.fig svg{width:100%;display:block;height:auto}
.fig img.photo{filter:grayscale(1)}
.cap{font-size:12px;line-height:1.5;color:var(--g)}
.tbl{border:1px solid var(--n);border-bottom:none}
.tbl>div{display:flex;border-bottom:1px solid var(--n)}
.tbl .k{width:104px;flex-shrink:0;padding:12px 10px;border-right:1px solid var(--n);font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--g);text-transform:uppercase}
.tbl .v{padding:11px 10px}
.next{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 14px;min-height:56px;width:100%}
.next .l{font-size:12px;letter-spacing:.06em}
.next .q{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:15px;line-height:1.3;text-transform:none}
.parts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.parts button{text-align:left;font-size:12px;padding:4px 10px}
.ask{text-align:left;font-family:'IBM Plex Sans',sans-serif;font-size:15px;text-transform:none;width:100%;padding:8px 12px}
.ans{font-size:17px;padding:2px 2px 10px}
input{font-family:'IBM Plex Sans',sans-serif;height:44px;width:100%;padding:0 10px;border:1px dashed var(--n);border-radius:0;background:#fff;font-size:16px;color:var(--n)}
.row{display:flex;align-items:center;gap:10px;padding:8px;text-align:left;background:#FBFAF5;width:100%;text-transform:none;font-family:'IBM Plex Sans',sans-serif}
.row img{width:72px;height:56px;object-fit:cover;flex-shrink:0;filter:grayscale(1);border:1px solid var(--n)}
.tb{border:2px solid var(--n);display:grid;grid-template-columns:1.6fr 1fr 1fr}
.tb>div{padding:7px 9px;border-right:1px solid var(--n);border-bottom:1px solid var(--n)}
.tb>div:nth-child(3n){border-right:none}
.tb>div:nth-child(n+4){border-bottom:none}
.tb .k{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;color:var(--g)}
.tb .v{margin-top:2px;font-weight:600;font-size:14px;line-height:1.3}
.bird{transform-origin:50% 85%}
@media (prefers-reduced-motion:no-preference){.bird{animation:flutter 9s ease-in-out 2s infinite}}
@keyframes flutter{0%,86%,100%{transform:none}88%{transform:translateY(-4px) rotate(-10deg)}90%{transform:translateY(-1px) rotate(6deg)}92%{transform:translateY(-4px) rotate(-8deg)}94%{transform:translateY(0) rotate(3deg)}96%{transform:translateY(-2px) rotate(-4deg)}}
</style>
</head>

l=\"{{ b2t }}\" stroke=\"none\">2<\/text><circle cx=\"268\" cy=\"160\" r=\"10\" fill=\"{{ b3f }}\" stroke=\"#16324F\" stroke-width=\"1.2\"><\/circle><text x=\"268\" y=\"164\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"{{ b3t }}\" stroke=\"none\">3<\/text><circle cx=\"38\" cy=\"160\" r=\"10\" fill=\"{{ b4f }}\" stroke=\"#16324F\" stroke-width=\"1.2\"><\/circle><text x=\"38\" y=\"164\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"{{ b4t }}\" stroke=\"none\">4<\/text>", "teaser": "a U-boat the US Navy captured and towed home"}, {"id": "jacquard", "name": "Jacquard loom", "sub": "Joseph Marie Jacquard, Lyon, 1804", "hook": "In 1804 a loom took its orders from holes punched in cards", "trick": "One card per row of pattern. Hole or blank decides which hooks lift", "facts": [["In use by 1812", "About 11,000 looms in France"], ["Speed", "From an inch of fancy silk a day to about two feet"], ["His reward", "A pension and a royalty on every machine"], ["Show piece", "His portrait in silk took 24,000 cards"]], "photoCaption": "Jacquard looms weaving patterned cloth at Muscogee Mills, Columbus, Georgia, 1977. HAER, Library of Congress", "toBlueprint": "How does a card lift a thread?", "parts": [["Card chain", "Cards laced edge to edge in a loop. Swap the deck and you swap the pattern"], ["Cylinder", "Turns one card at a time and presses it against a bank of pins"], ["Pins", "They feel for holes. Hole or blank sets each hook in or out of play"], ["Hooks", "The chosen hooks rise and pull up their warp threads for the shuttle"]], "toPerson": "Why did weavers burn it?", "personTitle": "The inventor", "person": [["Who", "Joseph Marie Jacquard, a Lyon silk weaver, 1752 to 1834"], ["The weavers", "Lyon silk weavers feared for their jobs. They burned looms and attacked him"], ["The state", "In 1806 the loom became public property. He got a pension and royalties"], ["The heirs", "Babbage took the cards for his Analytical Engine. Hollerith used them on the 1890 census"]], "canvas": [["Play up?", "The card chain, looping down over the weaver like a paper waterfall"], ["Glue on?", "Punched card stock, silk thread, a scrap of damask"]], "where": {"place": "Greenfield Village Weaving Shop, The Henry Ford", "city": "Dearborn, Michigan", "note": "Built in the Village shop in 1934, with 622 cards. Check hours first", "url": "https://www.thehenryford.org/collections-and-research/digital-collections/artifact/354319"}, "studio": {"work": "You painted Spinning Jenny (2026)", "line": "The jenny made thread by the armful. This loom told each thread where to go"}, "asks": [["Was Jacquard first with cards?", "No. Vaucanson built a card loom in 1745. Jacquard made the idea work"], ["What did Ada Lovelace say?", "The Analytical Engine \"weaves algebraical patterns just as the Jacquard-loom weaves flowers and leaves\""], ["Did anyone steal the cards?", "Yes. Rival mills sometimes stole card decks. Call it early software piracy"]], "teaser": "a loom that took its orders from holes punched in cards", "also": [], "personCaption": "Jacquard at his bench, from the 1839 memorial portrait made by Didier Petit of Lyon. Library of Congress", "imgMachine": "img/jacquard_machine.jpg", "imgPerson": "img/jacquard_person.jpg", "bp": {"img": "img/bp_jacquard.jpg", "cap": "A real one: hooks and needles inside a Jacquard head, Thomas Halton, US patent 185,027, 1876"}, "svg": ""}, {"id": "cable", "name": "San Francisco Cable Car", "sub": "Andrew Hallidie, Clay Street, 1873", "hook": "No engine on board. Each car grabs a cable running under the street", "trick": "One cable moves at a steady 9.5 mph. The car goes as fast as the grip lets it", "facts": [["First run", "Aug 2, 1873, 4 am"], ["Cable speed", "9.5 mph, always"], ["Powerhouse", "Winding wheels, 510-hp motors"], ["Chicago tie", "Chicago once ran the largest system"]], "photoCaption": "Winding wheels that drive the cables. Photo: HAER, Library of Congress", "toBlueprint": "How do you grab a moving cable?", "parts": [["Winding wheels", "Giant wheels in the powerhouse pull loops of cable at 9.5 mph"], ["Cable", "Runs in a channel under the street. You only see the slot"], ["Grip", "A 300-plus-pound set of pliers that reaches down through the slot"], ["Brakes", "Wheel, track, and an emergency 18-inch steel wedge jammed into the slot"]], "toPerson": "Who had the nerve to drive it first?", "personTitle": "The gripman", "personCaption": "Gripman and conductor turning a car. Photo: HAER, Library of Congress", "person": [["Who", "The gripman, who clamps and releases the cable"], ["Skill", "Too loose and it slips. Too tight and it won't seat"], ["Day one", "The hired gripman saw the hill and quit. Hallidie drove it himself"], ["Why", "Hallidie had watched horses struggle on wet cobblestones"]], "canvas": [["Play up?", "The hidden cable running under the street"], ["Glue on?", "Steel wire rope, a brass bell, cobblestone grit"]], "where": {"place": "San Francisco Cable Car Museum", "city": "San Francisco", "note": "Watch the real winding wheels run from a deck above", "url": "https://www.cablecarmuseum.org"}, "also": [["Chicago", "Its cable lines are gone. Chicago's system was once the biggest"]], "asks": [["Where did the idea come from?", "Hallidie's father made wire rope. Hallidie used cable to haul ore out of mines"], ["How does it stop?", "The gripman lets go of the cable and uses the brakes"], ["Why only San Francisco now?", "Electric streetcars replaced them elsewhere. San Francisco voters kept theirs"]], "imgMachine": "img/cable_machine.jpg", "imgPerson": "img/cable_person.jpg", "studio": {"work": "You painted the Keystone Drilling Machine, 2026", "line": "Mining gear again: Hallidie got the cable idea from hauling ore out of mines"}, "bp": {"img": "img/bp_cable.jpg", "cap": "A real one: cable car grip patent by B. L. Harris, 1887. The grip hangs under the car"}, "svg": "<path d=\"M0 96 H148 M158 96 H330\" stroke=\"#16324F\" stroke-width=\"2\"><\/path><rect x=\"60\" y=\"30\" width=\"122\" height=\"52\" rx=\"4\" fill=\"none\" stroke=\"#16324F\" stroke-width=\"1.4\"><\/rect><path d=\"M54 30 H188\" stroke=\"#16324F\" stroke-width=\"2\"><\/path><path d=\"M74 42 V70 M98 42 V70 M122 42 V70 M146 42 V70 M170 42 V70\" stroke=\"#4B5F74\" stroke-width=\"0.6\"><\/path><circle cx=\"80\" cy=\"88\" r=\"8\" fill=\"none\" stroke=\"#16324F\"><\/circle><circle cx=\"162\" cy=\"88\" r=\"8\" fill=\"none\" stroke=\"#16324F\"><\/circle><rect x=\"8\" y=\"120\" width=\"236\" height=\"28\" fill=\"none\" stroke=\"#4B5F74\" stroke-dasharray=\"4 3\"><\/rect><rect x=\"246\" y=\"108\" width=\"80\" height=\"86\" fill=\"none\" stroke=\"#4B5F74\" stroke-dasharray=\"4 3\"><\/rect><line x1=\"8\" y1=\"134\" x2=\"286\" y2=\"134\" stroke=\"{{ p2s }}\" stroke-width=\"3\"><\/line><circle cx=\"286\" cy=\"156\" r=\"30\" fill=\"{{ p1f }}\" stroke=\"{{ p1s }}\" stroke-width=\"1.6\"><\/circle><path d=\"M286 126 V186 M256 156 H316\" stroke=\"#16324F\" stroke-width=\"0.8\"><\/path><circle cx=\"286\" cy=\"156\" r=\"6\" fill=\"none\" stroke=\"#16324F\"><\/circle><rect x=\"148\" y=\"70\" width=\"10\" height=\"68\" fill=\"{{ p3f }}\" stroke=\"{{ p3s }}\" stroke-width=\"1.6\"><\/rect><polygon points=\"114,96 128,96 121,112\" fill=\"{{ p4f }}\" stroke=\"{{ p4s }}\" stroke-width=\"1.6\"><\/polygon><rect x=\"72\" y=\"98\" width=\"16\" height=\"6\" fill=\"{{ p4f }}\" stroke=\"{{ p4s }}\" stroke-width=\"1.6\"><\/rect><circle cx=\"300\" cy=\"96\" r=\"10\" fill=\"{{ b1f }}\" stroke=\"#16324F\" stroke-width=\"1.2\"><\/circle><text x=\"300\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"{{ b1t }}\" stroke=\"none\">1<\/text><circle cx=\"40\" cy=\"164\" r=\"10\" fill=\"{{ b2f }}\" stroke=\"#16324F\" stroke-width=\"1.2\"><\/circle><text x=\"40\" y=\"168\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"{{ b2t }}\" stroke=\"none\">2<\/text><circle cx=\"178\" cy=\"114\" r=\"10\" fill=\"{{ b3f }}\" stroke=\"#16324F\" stroke-width=\"1.2\"><\/circle><text x=\"178\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"{{ b3t }}\" stroke=\"none\">3<\/text><circle cx=\"100\" cy=\"114\" r=\"10\" fill=\"{{ b4f }}\" stroke=\"#16324F\" stroke-width=\"1.2\"><\/circle><text x=\"100\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"{{ b4t }}\" stroke=\"none\">4<\/text>", "teaser": "a car pulled up hills by a cable you can't see"}, {"id": "corliss", "name": "Corliss Centennial engine", "sub": "George Corliss, Providence, 1876", "hook": "The star of the 1876 world's fair spent 30 years running a Chicago rail car plant", "trick": "Four rotary valves, two for steam, two for exhaust. The governor sets the cutoff, so speed holds as the load swings", "facts": [["Size", "About 45 feet tall, flywheel 30 feet across with a 24 inch face"], ["Power", "Usually given as 1,400 hp at 36 rpm. The Pullman history site says 2,500"], ["Fuel", "About 30 percent more efficient than engines before it"], ["Chicago", "Pullman paid $77,000 and needed a 35 car train to bring it home"]], "photoCaption": "The Corliss engine in Machinery Hall, Philadelphia, 1876. Centennial Photographic Co. stereograph, Library of Congress", "toBlueprint": "How do you hold speed when the load jumps?", "parts": [["Governor", "Fly balls sense the speed and move the cutoff gear early or late"], ["Steam valves", "Two rotary valves let steam in fast, then shut at the cutoff the governor picks"], ["Exhaust valves", "Two more rotary valves let the spent steam out. Each job gets its own valve"], ["Flywheel", "On the big one it was also a gear, 30 feet across, driving the line shaft"]], "toPerson": "Who started it, and who started it again?", "personTitle": "The people at the lever", "person": [["Who", "George Corliss left school at 14 and clerked in a general store"], ["First patent", "A machine for stitching boots. He went to Providence for money and found steam"], ["The robin", "He once held up a boiler delivery because a robin nested in the wagon wheel"], ["In Chicago", "Florence Pullman started the engine at the car works on April 2, 1881"]], "canvas": [["Play up?", "The A-frame towering over a crowd of tiny top hats"], ["Glue on?", "Leather belting, an old railroad timetable, coal dust"]], "where": {"place": "The Henry Ford Museum", "city": "Dearborn, Michigan", "note": "Their 1859 Corliss is the only one left that his company built in his lifetime", "url": "https://www.thehenryford.org/collections/explore/articles/1859-corliss-steam-engine"}, "studio": {"work": "You painted Ingersoll Rand Gas Compressor at Seattle Gas Works", "line": "Another big piston machine built to keep a whole plant running"}, "asks": [["Did Pullman really buy it?", "Yes. The Pullman history site says he bought it in 1880. It ran the car works until fall 1910"], ["What did it drive at Pullman?", "About 3,268 feet of main shafting in tunnels, 13,000 feet overhead and two miles of belting"], ["Why was it scrapped?", "Electricity replaced steam at the works. The engine was sold for scrap in 1910"]], "teaser": "a steam engine that ran a world's fair, then a Chicago factory", "also": [["Chicago", "Pullman National Historical Park. The engine is gone, scrapped in 1910. The clock tower visitor center overlooked Lake Vista, its cooling pond"]], "personCaption": "President Grant and Dom Pedro of Brazil starting the engine, May 1876. Engraving from Harper's Weekly, Library of Congress", "imgMachine": "img/corliss_machine.jpg", "imgPerson": "img/corliss_person.jpg", "bp": {"img": "img/bp_corliss.jpg", "cap": "A real one: sheet 1 of George Corliss's steam engine patent, No. 6,162, 1849"}, "svg": ""}, {"id": "singer", "name": "Singer sewing machine", "sub": "Isaac Singer, Boston, patented 1851", "hook": "A sometime actor built it in eleven days on a backer's forty dollars", "trick": "A straight needle works up and down over a flat table. A pinned wheel feeds the cloth", "facts": [["Patent", "No. 8,294, August 12, 1851"], ["First try", "Five stitches, then the thread snapped"], ["Paid to Howe", "$15,000 in 1854, for a license"], ["Sold in 1875", "About 250,000, ten times any rival"]], "photoCaption": "An early I. M. Singer & Co machine, photographed about 1940. Harris & Ewing, Library of Congress", "toBlueprint": "How do two threads lock?", "parts": [["Treadle", "Heel and toe on a pivoted board. Both hands stay free to guide the cloth"], ["Needle", "Straight, with the eye at the point. An overhead shaft drives it up and down"], ["Shuttle", "Slides back and forth under the table with a second thread, locking each stitch"], ["Feed wheel", "Short pins poke up through a slot and walk the cloth along"]], "toPerson": "Who got to own one?", "personTitle": "The home sewer", "person": [["Who", "Tailors and factories came first. The 1851 machine was built for the trades"], ["Home model", "The first family machine came in 1858. Workers called it the Grasshopper"], ["Pay later", "Partner Edward Clark let families buy on installments, a first in the US"], ["The showroom", "Carved walnut, gilt and carpet. Young women ran the machines for the crowd"]], "canvas": [["Play up?", "The feet. Hands calm on the cloth while the legs do all the work"], ["Glue on?", "Thread, a tissue dress pattern, a strip of muslin"]], "where": {"place": "National Museum of American History", "city": "Washington, DC", "note": "Singer's 1851 patent model is listed in the American Enterprise exhibition", "url": "https://www.si.edu/object/nmah_1071133"}, "studio": {"work": "You painted Bridgeport Mill", "line": "Early Singer parts were filed by hand to fit. Mill work, later on"}, "asks": [["Who was Elias Howe?", "He patented the eye-pointed needle with a shuttle in 1846. Then he sued Singer"], ["What ended the patent war?", "A patent pool in 1856. Fees later fell from $25 a machine to $5"], ["Could he patent the treadle?", "No. It had been in public use for two years, so it was too late"]], "teaser": "a machine a sometime actor built in eleven days, then sold on installments", "also": [], "personCaption": "A woman sewing at a Singer machine, 1917 or 1918. Library of Congress", "imgMachine": "img/singer_machine.jpg", "imgPerson": "img/singer_person.jpg", "bp": {"img": "img/bp_singer.jpg", "cap": "A real one: sheet 1 of Isaac Singer's sewing machine patent, No. 8,294, 1851"}, "svg": ""}, {"id": "steamshovel", "name": "Steam shovel", "sub": "Bucyrus and Marion, Panama Canal, 1904 to 1914", "hook": "The man who invented it died at 26, the same year he got the patent", "trick": "A boiler on a rail car works a boom, a dipper stick and a toothed bucket. Pull a pin and the load drops", "facts": [["At Panama", "102 steam shovels. Bucyrus built 77, Marion the rest"], ["Biggest", "95 tons, with a dipper that took up to 5 cubic yards a bite"], ["Shift", "Ten hours a day, six days a week, in stiff clay and blasted rock"], ["Lost", "In 1915 the Patent Office searched and could not find Otis's drawing"]], "photoCaption": "Steam shovel No. 230 at work on the Panama Canal, about 1905 to 1914. Detroit Publishing Co., Library of Congress", "toBlueprint": "How does one bite of rock get to the train?", "parts": [["Boom", "Sits on the front of the car and carries the dipper and its rigging"], ["Dipper stick", "Slides out and in on the boom to push the bucket into the bank. That push is the crowd"], ["Bucket", "Toothed lip digs in. A locking pin lets the flap swing open to dump"], ["Swing", "The boom swings the load over to a rail car, then back for another bite"]], "toPerson": "Who climbed into the seat in a white suit?", "personTitle": "The president at the levers", "person": [["Who", "William Otis built the first one at 22. His cousin Elisha made the elevators"], ["His patent", "No. 1,089, a crane excavator for digging railroad cuts, dated 1839"], ["His end", "Typhoid fever, November 1839. He was 26"], ["The crew", "Usually three or more. An engineer, a fireman and a ground man moving rail and timber"]], "canvas": [["Play up?", "The bucket's teeth, huge, mid bite, with the crew tiny below"], ["Glue on?", "Rusty chain links, red clay, a scrap of rail timetable"]], "where": {"place": "IUOE Local 150, Joliet Road", "city": "Countryside, Illinois", "note": "A restored 1925 Erie Type B that still steams, on old Route 66. Call first, no visiting hours are posted", "url": "https://local150.org/news/steamshovel/"}, "studio": {"work": "You painted Keystone Drilling Machine (2026)", "line": "Another rig built to bite into the ground for a living"}, "asks": [["Why did it take so long to catch on?", "One account says the Otis family held the patent tight for decades"], ["Who made them full swing?", "The first shovel that could turn a full circle came from England in 1884"], ["What killed steam?", "Diesel shovels in the 1930s. They were simpler and cheaper to run"]], "teaser": "a boiler on rails that took a hill apart five yards at a time", "also": [], "personCaption": "Theodore Roosevelt at the controls of a steam shovel, Culebra Cut, November 1906. Underwood and Underwood stereograph, Library of Congress", "imgMachine": "img/steamshovel_machine.jpg", "imgPerson": "img/steamshovel_person.jpg", "bp": {"img": "img/bp_steamshovel.jpg", "cap": "A real one: C. M. Harrison's steam shovel patent, No. 716,538, 1902. Otis's own 1839 drawing is lost"}, "svg": ""}, {"id": "typewriter", "name": "Sholes & Glidden typewriter", "sub": "Milwaukee, built by Remington, 1874", "hook": "Gunmakers built it like a sewing machine, foot treadle and all", "trick": "All the typebars hit one printing point. Letters were scattered so neighbors would not clash", "facts": [["Price", "$125, when a pen cost a penny"], ["Letters", "Capitals only. No shift key until 1878"], ["Typing blind", "The bars struck from below, so you could not see the line"], ["Sold by 1877", "About 4,000"]], "photoCaption": "The Remington Model 1 shown at the 1876 Centennial, flowers and all. From The Story of s test machines, 1872. From The Story of the Typewriter, 1923", "imgMachine": "img/typewriter_machine.jpg", "imgPerson": "img/typewriter_person.jpg", "bp": {"img": "img/bp_typewriter.jpg", "cap": "A real one: C. L. Sholes's machine on its treadle stand, US patent 207,559, 1878"}, "svg": ""}, {"id": "wrightflyer", "name": "1903 Wright Flyer", "sub": "Orville and Wilbur Wright, Dayton, 1903", "hook": "The engine was built in six weeks with a lathe, a drill press and no drawings", "trick": "The pilot lies in a hip cradle. Slide your hips and the wings twist, and the rudder moves with them", "facts": [["First flight", "12 seconds, 120 feet, about 8 feet up, December 17, 1903"], ["Engine", "Four cylinders, water cooled, about 170 pounds, 12 hp"], ["Drive", "Sprockets and chain, like a bicycle, to two 8.5 foot props turning opposite ways"], ["Odd detail", "The right wing is 4 inches longer to make up for the engine's weight"]], "photoCaption": "The first flight, 10:35 am, December 17, 1903. Orville flying, Wilbur running. Library of Congress", "toBlueprint": "How do you steer with no ailerons at all?", "parts": [["Launch rail", "Four 15 foot 2x4s laid end to end. No wheels, the sand was too deep"], ["Engine and chains", "Charlie Taylor's 12 hp four turns both props through bicycle style chain"], ["Front elevator", "Two small surfaces out front control pitch. A lever in the left hand works them"], ["Hip cradle", "Shift your hips to warp the wings and swing the rear rudder together"]], "toPerson": "Who built the engine and stayed home?", "personTitle": "The mechanic from Illinois", "person": [["Who", "Charlie Taylor, born in a log cabin in rural Illinois, 1868"], ["The crank", "Cut from a steel slab. He drilled the outline, chiseled the waste, then turned it"], ["The plans", "Sketches on scratch paper, spiked over his bench"], ["The end", "He died poor in Los Angeles in 1956. Mechanics now honor his birthday, May 24"]], "canvas": [["Play up?", "A man lying flat in a white k     }
    h += '<div class="col" style="gap:10px"><div class="note">Note 2: from your studio</div>'+tbl([['You painted', d.studio.work.replace('You painted ','')],['The link', d.studio.line]])+'</div>';
    h += '<div class="col" style="gap:10px"><div class="note">Note 3: if it ever lands on your easel</div>'+tbl(d.canvas)+'</div>';
    h += '<div class="col" style="gap:10px"><div class="note">Note 4: see it in person, '+esc(d.where.city)+'</div>'+tbl([['Place',d.where.place],['Tip',d.where.note]].concat(d.also))+'<a class="btn" href="'+d.where.url+'" target="_blank" rel="noopener">Plan a visit</a></div>';
    h += '<div class="col" style="gap:8px"><div class="note" style="margin-bottom:2px">Note 5: curious? ask</div>'+d.asks.map((a,i)=>'<button class="ask'+(S.ask===i?' on':'')+'" data-act="ask:'+i+'" aria-expanded="'+(S.ask===i)+'">'+esc(a[0])+'</button>'+(S.ask===i?'<div class="ans">'+esc(a[1])+'</div>':'')).join('')+'</div>';
    const today = new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const cell = (k,v) => '<div><div class="k">'+k+'</div><div class="v">'+esc(v)+'</div></div>';
    h += '<div class="col" style="gap:10px"><div class="tb">'+cell('TITLE',d.name)+cell('DWG NO',('00'+(S.day+1)).slice(-3))+cell('SHEET',(vi+1)+' of 3')+cell(hasNext?'NEXT ONE':'NEXT ISSUE',hasNext?DAYS[S.day+1].name+': '+DAYS[S.day+1].hook:(ALL[OPEN]?'Tomorrow: '+ALL[OPEN].teaser:'A new run of machines is on the way'))+cell('DATE',dateFor(S.day).replace(/^\w+, /,''))+cell('DRAWN FOR','Chill Bill')+'</div>'+(hasNext?'<button class="fill" data-act="open:'+(S.day+1)+'" style="align-self:flex-start">Open the next one</button>':'')+'</div>';
  }
  document.getElementById('app').innerHTML = h;
}
document.getElementById('app').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const [act, arg] = b.dataset.act.split(':'); let top = false;
  if (act === 'tab') { if (arg === 'today') { Object.assign(S,{screen:'read',day:LAST,view:'machine',part:0,ask:null}); } else S.screen = arg; top = true; }
  else if (act === 'open') { Object.assign(S,{from:S.screen==='read'?S.from:S.screen,screen:'read',day:+arg,view:'machine',part:0,ask:null}); top = true; }
  else if (act === 'back') { S.screen = S.from; top = true; }
  else if (act === 'star') { S.stars[DAYS[S.day].id] = !S.stars[DAYS[S.day].id]; keep(); }
  else if (act === 'view') { S.view = arg; S.part = 0; top = b.classList.contains('next'); }
  else if (act === 'part') { S.part = +arg; }
  else if (act === 'ask') { S.ask = S.ask === +arg ? null : +arg; }
  render(); if (top) window.scrollTo(0, 0);
});
document.getElementById('app').addEventListener('input', (e) => { if (e.target.id === 'why') { S.notes[DAYS[S.day].id] = e.target.value; keep(); } });
render();
</script>
</body>
</html>
