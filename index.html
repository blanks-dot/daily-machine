<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The Daily Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{--n:#16324F;--p:#F7F5EE;--g:#4B5F74;--a:#A8481A}
*{box-sizing:border-box}
body{margin:0;background-color:#F2F0E8;background-image:linear-gradient(#DDE3E6 1px,transparent 1px),linear-gradient(90deg,#DDE3E6 1px,transparent 1px);background-size:20px 20px;font-family:'IBM Plex Sans',sans-serif;color:var(--n);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.sheet{max-width:460px;margin:12px auto;border:2px solid var(--n);background:var(--p);padding:20px 16px 16px;display:flex;flex-direction:column;gap:32px}
@media(max-width:484px){.sheet{margin:12px}}
.mono{font-family:'IBM Plex Mono',monospace}
.cond{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;text-transform:uppercase}
.col{display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.name{font-size:22px;letter-spacing:.04em}
button,a.btn{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;text-transform:uppercase;cursor:pointer;border-radius:0;border:2px solid var(--n);background:var(--p);color:var(--n);min-height:44px;padding:4px 14px;-webkit-appearance:none;appearance:none}
button.on,button.fill,a.btn{background:var(--n);color:var(--p)}
a.btn{display:inline-flex;align-items:center;text-decoration:none;align-self:flex-start}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--n)}
.seg button{border:none;border-left:1px solid var(--n);padding:0 2px;font-size:12px}
.seg button:first-child{border-left:none}
.kick{font-size:12px;color:var(--g);text-transform:uppercase}
h1{margin:0;font-size:42px;line-height:1;letter-spacing:.01em}
h2{margin:0;font-size:26px;line-height:1.1}
.hook{font-size:19px;line-height:1.4;margin-top:4px}
.note{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;letter-spacing:.06em;color:var(--a);text-transform:uppercase}
.fig{border:1px solid var(--n);background:#FBFAF5;padding:8px}
.fig img,.fig svg{width:100%;display:block;height:auto}
.fig img.photo{filter:grayscale(1)}
.cap{font-size:12px;line-height:1.5;color:var(--g)}
.tbl{border:1px solid var(--n);border-bottom:none}
.tbl>div{display:flex;border-bottom:1px solid var(--n)}
.tbl .k{width:104px;flex-shrink:0;padding:12px 10px;border-right:1px solid var(--n);font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--g);text-transform:uppercase}
.tbl .v{padding:11px 10px}
.next{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 14px;min-height:56px;width:100%}
.next .l{font-size:12px;letter-spacing:.06em}
.next .q{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:15px;line-height:1.3;text-transform:none}
.parts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.parts button{text-align:left;font-size:12px;padding:4px 10px}
.ask{text-align:left;font-family:'IBM Plex Sans',sans-serif;font-size:15px;text-transform:none;width:100%;padding:8px 12px}
.ans{font-size:17px;padding:2px 2px 10px}
input{font-family:'IBM Plex Sans',sans-serif;height:44px;width:100%;padding:0 10px;border:1px dashed var(--n);border-radius:0;background:#fff;font-size:16px;color:var(--n)}
.row{display:flex;align-items:center;gap:10px;padding:8px;text-align:left;background:#FBFAF5;width:100%;text-transform:none;font-family:'IBM Plex Sans',sans-serif}
.row img{width:72px;height:56px;object-fit:cover;flex-shrink:0;filter:grayscale(1);border:1px solid var(--n)}
.tb{border:2px solid var(--n);display:grid;grid-template-columns:1.6fr 1fr 1fr}
.tb>div{padding:7px 9px;border-right:1px solid var(--n);border-bottom:1px solid var(--n)}
.tb>div:nth-child(3n){border-right:none}
.tb>div:nth-child(n+4){border-bottom:none}
.tb .k{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;color:var(--g)}
.tb .v{margin-top:2px;font-weight:600;font-size:14px;line-height:1.3}
.bird{transform-origin:50% 85%}
@media (prefers-reduced-motion:no-preference){.bird{animation:flutter 9s ease-in-out 2s infinite}}
@keyframes flutter{0%,86%,100%{transform:none}88%{transform:translateY(-4px) rotate(-10deg)}90%{transform:translateY(-1px) rotate(6deg)}92%{transform:translateY(-4px) rotate(-8deg)}94%{transform:translateY(0) rotate(3deg)}96%{transform:translateY(-2px) rotate(-4deg)}}
</style>
</head>

const START = new Date(2026, 10, 27);
const PREVIEW = /[?&]preview/.test(location.search);
const t0 = new Date(); t0.setHours(0,0,0,0);
const OPEN = PREVIEW ? ALL.length : Math.max(0, Math.min(ALL.length, Math.floor((t0 - START) / 864e5) + 1));
const DAYS = ALL.slice(0, OPEN);
const LAST = DAYS.length - 1;
const dateFor = (i) => { const x = new Date(START); x.setDate(x.getDate() + i); return x.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'}); };
const VIEWS = [['machine','1 Machine'],['blueprint','2 Blueprint'],['person','3 Person']];
const KEY = 'daily-machine-v1';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const S = { screen:'read', from:'past', day:LAST, view:'machine', part:0, ask:null, stars:saved.stars||{}, notes:saved.notes||{} };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keep = () => { try { localStorage.setItem(KEY, JSON.stringify({stars:S.stars, notes:S.notes})); } catch (e) {} };
const BIRD = '<svg class="bird" aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#16324F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7h.01"/><path d="M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 20"/><path d="m20 7 2 .5-2 .5"/><path d="M10 18v3"/><path d="M14 17.75V21"/></svg>';
const ARROW = (c) => '<svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="'+c+'" stroke-width="2" stroke-linecap="square" style="flex-shrink:0"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const STAR = (fill, stroke) => '<svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.6" stroke-linejoin="round" style="flex-shrink:0"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
const tbl = (rows) => '<div class="tbl">' + rows.map((r) => '<div><span class="k">'+esc(r[0])+'</span><span class="v">'+esc(r[1])+'</span></div>').join('') + '</div>';
const seg = (items) => '<div class="seg">' + items.map((i) => '<button data-act="'+i[0]+'" class="'+(i[2]?'on':'')+'">'+esc(i[1])+'</button>').join('') + '</div>';
const fig = (src, cap, photo) => '<div class="col" style="gap:6px"><div class="fig"><img '+(photo?'class="photo" ':'')+'src="'+src+'" alt="'+esc(cap)+'"></div><span class="mono cap">'+esc(cap)+'</span></div>';
const no = (i) => dateFor(i) + ', No. ' + (i + 1);
function diagram(d) {
  const v = {};
  [0,1,2,3].forEach((i) => { const on = S.part === i; v['p'+(i+1)+'f'] = on ? '#D5DEE8' : 'none'; v['p'+(i+1)+'s'] = '#16324F'; v['b'+(i+1)+'f'] = on ? '#16324F' : '#F7F5EE'; v['b'+(i+1)+'t'] = on ? '#F7F5EE' : '#16324F'; });
  return '<svg role="img" aria-label="Simple diagram of the '+esc(d.name)+'" viewBox="0 0 330 200" fill="none">' + d.svg.replace(/\{\{\s*(\w+)\s*\}\}/g, (m, k) => v[k]) + '</svg>';
}
function render() {
  if (!DAYS.length) { document.getElementById('app').innerHTML = '<div class="top"><div class="cond name">The Daily Machine</div>'+BIRD+'</div><div class="col" style="gap:12px"><h1 class="cond" style="font-size:34px">First drawing arrives '+dateFor(0)+'</h1><div class="hook">One machine a day: the machine, the blueprint, and the person behind it</div></div><div class="tb"><div><div class="k">TITLE</div><div class="v">Coming soon</div></div><div><div class="k">DWG NO</div><div class="v">001</div></div><div><div class="k">SHEET</div><div class="v">0 of 3</div></div><div><div class="k">NEXT ISSUE</div><div class="v">'+esc(ALL[0].teaser)+'</div></div><div><div class="k">DATE</div><div class="v">'+dateFor(0)+'</div></div><div><div class="k">DRAWN FOR</div><div class="v">Chill Bill</div></div></div>'; return; }
  const d = DAYS[S.day], savedIdx = DAYS.map((x,i)=>i).filter((i)=>S.stars[DAYS[i].id]);
  const n = savedIdx.length;
  let h = '<div class="col" style="gap:12px"><div class="top"><div class="cond name">The Daily Machine</div>'+BIRD+'</div>' +
    seg([['tab:today','Today',S.screen==='read'&&S.day===LAST],['tab:past','Past',S.screen==='past'],['tab:saved','Saved '+(n<10?'0':'')+n,S.screen==='saved']]) + '</div>';
  if (S.screen !== 'read') {
    const isSaved = S.screen === 'saved';
    const idx = (isSaved ? savedIdx : DAYS.map((x,i)=>i)).slice().reverse();
    h += '<div class="col" style="gap:12px"><h2 class="cond" style="font-size:30px">'+(isSaved?'Your saved machines':'Past machines')+'</h2><div>'+(isSaved?(n?'Tap one to read it again':'Nothing saved yet. Tap Save on any machine and it lands here'):'Newest first. Tap one to read it')+'</div>';
    idx.forEach((i) => { const x = DAYS[i], st = !!S.stars[x.id], nt = S.notes[x.id];
      h += '<button class="row" data-act="open:'+i+'" aria-label="Open '+esc(x.name)+'"><img src="'+x.imgMachine+'" alt=""><span class="col" style="flex:1;min-width:0;gap:2px"><span class="mono kick">'+no(i)+'</span><span class="cond" style="font-size:18px;line-height:1.1">'+esc(x.name)+'</span><span style="font-size:13px;line-height:1.35">'+esc(isSaved&&nt?'Your note: '+nt:x.hook)+'</span></span>'+STAR(st?'#16324F':'none',st?'#16324F':'#9AA6B2')+ARROW('#16324F')+'</button>'; });
    h += '</div>';
  } else {
    const st = !!S.stars[d.id], vi = VIEWS.findIndex((v)=>v[0]===S.view), hasNext = S.day < LAST;
    if (S.day !== LAST) h += '<button data-act="back" style="align-self:flex-start;display:flex;align-items:center;gap:6px;font-size:12px"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#16324F" stroke-width="2" stroke-linecap="square"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>'+(S.from==='saved'?'Saved':'Past machines')+'</button>';
    h += '<div class="col" style="gap:8px"><div class="mono kick">'+(S.day===LAST?'Today, ':'')+no(S.day)+'</div><h1 class="cond">'+esc(d.name)+'</h1><div class="mono" style="font-size:12px;color:var(--g)">'+esc(d.sub)+'</div><div class="hook">'+esc(d.hook)+'</div></div>';
    h += '<div class="col" style="gap:8px"><button data-act="star" class="'+(st?'fill':'')+'" style="align-self:flex-start;display:flex;align-items:center;gap:8px">'+STAR(st?'#F7F5EE':'none',st?'#F7F5EE':'#16324F')+(st?'Saved':'Save for later')+'</button>' +
      (st ? '<div class="col" style="gap:4px"><label for="why" class="mono" style="font-size:12px;color:var(--g)">WHY THIS ONE? JOT A NOTE IF YOU LIKE</label><input id="why" type="text" placeholder="Type here" value="'+esc(S.notes[d.id]||'')+'"></div>' : '') + '</div>';
    h += seg(VIEWS.map((v) => ['view:'+v[0], v[1], v[0]===S.view]));
    if (S.view === 'machine') {
      h += '<div class="col" style="gap:24px">'+fig(d.imgMachine,d.photoCaption,true)+'<div class="col" style="gap:6px"><div class="note">Note 1: the clever trick</div><div style="font-size:17px">'+esc(d.trick)+'</div></div>'+tbl(d.facts)+
        '<button class="fill next" data-act="view:blueprint"><span class="col" style="flex:1;gap:2px"><span class="l">Next sheet: blueprint</span><span class="q">'+esc(d.toBlueprint)+'</span></span>'+ARROW('#F7F5EE')+'</button></div>';
    } else if (S.view === 'blueprint') {
      h += '<div class="col" style="gap:24px">'+(d.bp.img?fig(d.bp.img,d.bp.cap,false):'')+
        '<div class="col" style="gap:8px"><div class="note">'+(d.svg?(d.bp.img?'How it works, simplified':'How it works, our sketch'):'How it works, part by part')+'</div>'+(d.svg?'<div class="fig">'+diagram(d)+'</div>':'')+'<div class="mono cap">TAP A PART</div><div class="parts">'+
        d.parts.map((p,i)=>'<button data-act="part:'+i+'" class="'+(S.part===i?'on':'')+'">'+(i+1)+' '+esc(p[0])+'</button>').join('')+'</div>'+
        '<div class="col" style="gap:4px;padding-top:4px;min-height:92px"><span class="mono cap">PART '+(S.part+1)+' OF 4: '+esc(d.parts[S.part][0]).toUpperCase()+'</span><span style="font-size:18px;line-height:1.45">'+esc(d.parts[S.part][1])+'</span></div></div>'+
        '<button class="fill next" data-act="view:person"><span class="col" style="flex:1;gap:2px"><span class="l">Next sheet: the person</span><span class="q">'+esc(d.toPerson)+'</span></span>'+ARROW('#F7F5EE')+'</button></div>';
    } else {
      h += '<div class="col" style="gap:24px">'+(d.imgPerson?fig(d.imgPerson,d.personCaption,true):'')+'<h2 class="cond">'+esc(d.personTitle)+'</h2>'+tbl(d.person)+'</div>';
    }
    h += '<div class="col" style="gap:10px"><div class="note">Note 2: from your studio</div>'+tbl([['You painted', d.studio.work.replace('You painted ','')],['The link', d.studio.line]])+'</div>';
    h += '<div class="col" style="gap:10px"><div class="note">Note 3: if it ever lands on your easel</div>'+tbl(d.canvas)+'</div>';
    h += '<div class="col" style="gap:10px"><div class="note">Note 4: see it in person, '+esc(d.where.city)+'</div>'+tbl([['Place',d.where.place],['Tip',d.where.note]].concat(d.also))+'<a class="btn" href="'+d.where.url+'" target="_blank" rel="noopener">Plan a visit</a></div>';
    h += '<div class="col" style="gap:8px"><div class="note" style="margin-bottom:2px">Note 5: curious? ask</div>'+d.asks.map((a,i)=>'<button class="ask'+(S.ask===i?' on':'')+'" data-act="ask:'+i+'" aria-expanded="'+(S.ask===i)+'">'+esc(a[0])+'</button>'+(S.ask===i?'<div class="ans">'+esc(a[1])+'</div>':'')).join('')+'</div>';
    const today = new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const cell = (k,v) => '<div><div class="k">'+k+'</div><div class="v">'+esc(v)+'</div></div>';
    h += '<div class="col" style="gap:10px"><div class="tb">'+cell('TITLE',d.name)+cell('DWG NO',('00'+(S.day+1)).slice(-3))+cell('SHEET',(vi+1)+' of 3')+cell(hasNext?'NEXT ONE':'NEXT ISSUE',hasNext?DAYS[S.day+1].name+': '+DAYS[S.day+1].hook:(ALL[OPEN]?'Tomorrow: '+ALL[OPEN].teaser:'A new run of machines is on the way'))+cell('DATE',dateFor(S.day).replace(/^\w+, /,''))+cell('DRAWN FOR','Chill Bill')+'</div>'+(hasNext?'<button class="fill" data-act="open:'+(S.day+1)+'" style="align-self:flex-start">Open the next one</button>':'')+'</div>';
  }

document.getElementById('app').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const [act, arg] = b.dataset.act.split(':'); let top = false;
  if (act === 'tab') { if (arg === 'today') { Object.assign(S,{screen:'read',day:LAST,view:'machine',part:0,ask:null}); } else S.screen = arg; top = true; }
  else if (act === 'open') { Object.assign(S,{from:S.screen==='read'?S.from:S.screen,screen:'read',day:+arg,view:'machine',part:0,ask:null}); top = true; }
  else if (act === 'back') { S.screen = S.from; top = true; }
  else if (act === 'star') { S.stars[DAYS[S.day].id] = !S.stars[DAYS[S.day].id]; keep(); }
  else if (act === 'view') { S.view = arg; S.part = 0; top = b.classList.contains('next'); }
  else if (act === 'part') { S.part = +arg; }
  else if (act === 'ask') { S.ask = S.ask === +arg ? null : +arg; }
  render(); if (top) window.scrollTo(0, 0);
});
document.getElementById('app').addEventListener('input', (e) => { if (e.target.id === 'why') { S.notes[DAYS[S.day].id] = e.target.value; keep(); } });
render();
