<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The Daily Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{--n:#16324F;--p:#F7F5EE;--g:#4B5F74;--a:#A8481A}
*{box-sizing:border-box}
body{margin:0;background-color:#F2F0E8;background-image:linear-gradient(#DDE3E6 1px,transparent 1px),linear-gradient(90deg,#DDE3E6 1px,transparent 1px);background-size:20px 20px;font-family:'IBM Plex Sans',sans-serif;color:var(--n);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.sheet{max-width:460px;margin:12px auto;border:2px solid var(--n);background:var(--p);padding:20px 16px 16px;display:flex;flex-direction:column;gap:32px}
@media(max-width:484px){.sheet{margin:12px}}
.mono{font-family:'IBM Plex Mono',monospace}
.cond{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;text-transform:uppercase}
.col{display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.name{font-size:22px;letter-spacing:.04em}
button,a.btn{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;text-transform:uppercase;cursor:pointer;border-radius:0;border:2px solid var(--n);background:var(--p);color:var(--n);min-height:44px;padding:4px 14px;-webkit-appearance:none;appearance:none}
button.on,button.fill,a.btn{background:var(--n);color:var(--p)}
a.btn{display:inline-flex;align-items:center;text-decoration:none;align-self:flex-start}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--n)}
.seg button{border:none;border-left:1px solid var(--n);padding:0 2px;font-size:12px}
.seg button:first-child{border-left:none}
.kick{font-size:12px;color:var(--g);text-transform:uppercase}
h1{margin:0;font-size:42px;line-height:1;letter-spacing:.01em}
h2{margin:0;font-size:26px;line-height:1.1}
.hook{font-size:19px;line-height:1.4;margin-top:4px}
.note{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;letter-spacing:.06em;color:var(--a);text-transform:uppercase}
.fig{border:1px solid var(--n);background:#FBFAF5;padding:8px}
.fig img,.fig svg{width:100%;display:block;height:auto}
.fig img.photo{filter:grayscale(1)}
.cap{font-size:12px;line-height:1.5;color:var(--g)}
.tbl{border:1px solid var(--n);border-bottom:none}
.tbl>div{display:flex;border-bottom:1px solid var(--n)}
.tbl .k{width:104px;flex-shrink:0;padding:12px 10px;border-right:1px solid var(--n);font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--g);text-transform:uppercase}
.tbl .v{padding:11px 10px}
.next{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 14px;min-height:56px;width:100%}
.next .l{font-size:12px;letter-spacing:.06em}
.next .q{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:15px;line-height:1.3;text-transform:none}
.parts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.parts button{text-align:left;font-size:12px;padding:4px 10px}
.ask{text-align:left;font-family:'IBM Plex Sans',sans-serif;font-size:15px;text-transform:none;width:100%;padding:8px 12px}
.ans{font-size:17px;padding:2px 2px 10px}
input{font-family:'IBM Plex Sans',sans-serif;height:44px;width:100%;padding:0 10px;border:1px dashed var(--n);border-radius:0;background:#fff;font-size:16px;color:var(--n)}
.row{display:flex;align-items:center;gap:10px;padding:8px;text-align:left;background:#FBFAF5;width:100%;text-transform:none;font-family:'IBM Plex Sans',sans-serif}
.row img{width:72px;height:56px;object-fit:cover;flex-shrink:0;filter:grayscale(1);border:1px solid var(--n)}
.tb{border:2px solid var(--n);display:grid;grid-template-columns:1.6fr 1fr 1fr}
.tb>div{padding:7px 9px;border-right:1px solid var(--n);border-bottom:1px solid var(--n)}
.tb>div:nth-child(3n){border-right:none}
.tb>div:nth-child(n+4){border-bottom:none}
.tb .k{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;color:var(--g)}
.tb .v{margin-top:2px;font-weight:600;font-size:14px;line-height:1.3}
.bird{transform-origin:50% 85%}
@media (prefers-reduced-motion:no-preference){.bird{animation:flutter 9s ease-in-out 2s infinite}}
@keyframes flutter{0%,86%,100%{transform:none}88%{transform:translateY(-4px) rotate(-10deg)}90%{transform:translateY(-1px) rotate(6deg)}92%{transform:translateY(-4px) rotate(-8deg)}94%{transform:translateY(0) rotate(3deg)}96%{transform:translateY(-2px) rotate(-4deg)}}
</style>
</head>

 Illinois"], ["The bet", "He put up $25,000 of his own for plans and safety studies"], ["First turn", "He was away. He told his man Luther Rice to \"turn the wheel or tear it off the towers\""], ["The end", "Lawsuits followed the fair. He died of typhoid in 1896, aged 37"]], "canvas": [["Play up?", "The spokes, thin as thread, against that one fat axle"], ["Glue on?", "Bicycle spokes, a length of roller chain, an old fair ticket"]], "where": {"place": "Centennial Wheel, Navy Pier", "city": "Chicago", "note": "Nearly 200 feet tall. The 1893 wheel stood midway down the mile-long Midway Plaisance", "url": "https://navypier.org/?p=1417"}, "studio": {"work": "You painted Felt and Trek racing bikes", "line": "Same trick as their wheels, a rim hung from spokes in tension"}, "asks": [["What happened to it?", "It ran on Clark Street from 1895 to 1903, then at the 1904 St. Louis fair. Dynamited for scrap in 1906"], ["Did it pay?", "Yes. About 1.45 million tickets at 50 cents made it the fair's most profitable attraction"], ["Where is the axle?", "Nobody is sure. A survey hints it lies buried in St. Louis. Other reports say it was cut up"]], "teaser": "a 264 foot wheel built through a frozen winter to answer the Eiffel Tower", "also": [], "personCaption": "George Washington Gale Ferris Jr., before 1896. Public domain, via Wikimedia Commons", "imgMachine": "img/ferris_machine.jpg", "imgPerson": "img/ferris_person.jpg", "bp": {"img": "", "cap": ""}, "svg": ""}, {"id": "zephyr", "name": "Pioneer Zephyr", "sub": "Burlington Route, built by Budd, 1934", "hook": "Denver to Chicago, 1,015 miles, in about 13 hours. Fuel cost: $14.64", "trick": "Shotwelding let Budd join stainless steel without ruining its strength or rust resistance", "facts": [["Engine", "Winton 201A, 600 hp diesel"], ["Top speed", "112.5 mph on the run"], ["Record run", "May 26, 1934"], ["Retired", "1960, after 3.2 million miles"]], "photoCaption": "Budd Company photo of the Zephyr, 1934. Public domain", "toBlueprint": "How does a diesel drive electric wheels?", "parts": [["Diesel", "An 8-cylinder, 600-hp diesel. No spark plugs: squeezing the air lights the fuel"], ["Generator", "The diesel spins a 600-volt generator. Electricity, not gears, drives the wheels"], ["Shared wheels", "Cars share wheel sets at each joint, so the whole train is one long, light unit"], ["Steel skin", "Shotwelded stainless steel. Rivetless seams, and it doesn't rust"]], "toPerson": "Who bet the railroad on it?", "personTitle": "The railroad president and a burro", "personCaption": "Zeph the burro rode the record run, 1934. Public domain", "person": [["Who", "Ralph Budd, Burlington president. No relation to the builder"], ["The bet", "He promised Denver to Chicago in 14 hours, nonstop"], ["After", "\"It was a sweet ride,\" he said, stepping off"], ["Stowaway", "A burro named Zeph rode along as a mascot"]], "canvas": [["Play up?", "The fluted stainless steel nose"], ["Glue on?", "Stainless strips, a ticket stub, a map line"]], "where": {"place": "Griffin Museum of Science and Industry", "city": "Chicago", "note": "On display since 1960, indoors since 1998", "url": "https://www.griffinmsi.org/exhibits/pioneer-zephyr"}, "also": [], "asks": [["Why stainless steel?", "It was light and didn't rust. Shotwelding made it possible to build with"], ["Was it really nonstop?", "That's the legend. Some railroad writers say there may have been a secret fuel stop"], ["Who rode along?", "Passengers later called the Dawn to Dusk Club, plus Zeph the burro"]], "imgMachine": "img/zephyr_machine.jpg", "imgPerson": "img/zephyr_person.jpg", "studio": {"work": "You painted the CNC Lathe, 2026", "line": "You glued stainless steel chips on that one. This whole train is stainless"}, "bp": {"img": "img/bp_zephyr.jpg", "cap": "A real one: M. P. Blomberg patent for a three-section articulated streamliner, filed March 1934. Not the Zephyr itself, a close cousin"}, "svg": "<line x1=\"0\" y1=\"176\" x2=\"330\" y2=\"176\" stroke=\"#1632 lay up?", "Giant teeth marching up the canvas, half locked and half open"], ["Glue on?", "Real zipper tape, a brass slider, a scrap of rubber boot"]], "where": {"place": "National Museum of American History", "city": "Washington, DC", "note": "Sundback's patent model is listed with the American Enterprise show. Ask if it is out", "url": "https://www.si.edu/object/nmah_860486"}, "studio": {"work": "You painted Spinning Jenny (2026)", "line": "Both changed how clothes get made, and both are all about tiny repeated parts"}, "asks": [["Was Judson first?", "No. Elias Howe patented a clothing closure in 1851 but never sold it"], ["Why shoes?", "Judson's 1893 patents were for doing up shoes, not clothes"], ["When did pants get them?", "Clothes waited until the 1930s. In 1937 the zipper beat the button fly"]], "teaser": "a Chicago flop from the 1893 fair that half the world now wears", "also": [], "personCaption": "Gideon Sundback, about 1920. Wikimedia Commons, public domain", "imgMachine": "img/zipper_machine.jpg", "imgPerson": "img/zipper_person.jpg", "bp": {"img": "img/bp_zipper.jpg", "cap": "A real one: Gideon Sundback's separable fastener, US patent 1,219,881, 1917"}, "svg": ""}, {"id": "lino", "name": "Linotype", "sub": "Ottmar Mergenthaler, 1886", "hook": "Type a line, and the machine casts the whole line in hot metal", "trick": "The keys run by how often letters are used, not QWERTY: e-t-a-o-i-n, s-h-r-d-l-u", "facts": [["First used", "July 1886, New York Tribune"], ["Keyboard", "90 characters"], ["By 1889", "The Tribune ran 42 at once"], ["Edison called it", "\"The eighth wonder of the world\""]], "photoCaption": "Linotype at a government print office, c. 1903. Public domain", "toBlueprint": "How does one keystroke become hot metal?", "parts": [["Keyboard", "90 keys. Each one releases a brass letter mold"], ["Magazine", "The rack on top that stores the brass molds, called matrices"], ["Metal pot", "Molten type metal is pushed into the lined-up molds"], ["Slug", "Out comes one solid line of type, ready for the page"]], "toPerson": "What did a mistake look like?", "personTitle": "The operator", "personCaption": "Linotype operators at work, c. 1935. Public domain", "person": [["Who", "Newspaper operators setting tomorrow's paper"], ["The sound", "42 machines at once at the Tribune. Loud and messy"], ["The mistake", "Botched lines were filled with \"etaoin shrdlu\" and pulled. Some got printed"], ["The end", "The New York Times set its last hot-metal paper in 1978"]], "canvas": [["Play up?", "Brass letter molds raining down"], ["Glue on?", "Real lead type, newsprint, a brass matrix"]], "where": {"place": "International Printing Museum", "city": "Los Angeles area", "note": "Carson, CA. Working Linotypes run on Saturdays", "url": "https://www.printmuseum.org"}, "also": [["Chicago", "None on public display that we could confirm yet"]], "asks": [["Why not QWERTY?", "The backers asked for it in 1885. Linotype kept its own layout, sorted by letter use"], ["Who paid for it?", "Whitelaw Reid, publisher of the New York Tribune, was a backer. So the Tribune went first"], ["What replaced it?", "Computer typesetting. The Times film about its last night was called Farewell, Etaoin Shrdlu"]], "imgMachine": "img/lino_machine.jpg", "imgPerson": "img/lino_person.jpg", "studio": {"work": "You painted the Spinning Jenny, 2026", "line": "Both let one operator do the work of many hands"}, "bp": {"img": "img/bp_lino.jpg", "cap": "A real one: Mergenthaler's own Linotype patent, 1890"}, "svg": "<polygon points=\"30,14 190,14 220,72 60,72\" fill=\"{{ p2f }}\" stroke=\"{{ p2s }}\" stroke-width=\"1.6\"><\/polygon><path d=\"M70 26 H180 M80 40 H192 M90 54 H204\" stroke=\"#4B5F74\" stroke-width=\"0.6\"><\/path><rect x=\"110\" y=\"100\" width=\"100\" height=\"16\" rx=\"3\" fill=\"none\" stroke=\"#4B5F74\" stroke-dasharray=\"3 3\"><\/rect><rect x=\"20\" y=\"148\" width=\"150\" height=\"34\" rx=\"4\" fill=\"{{ p1f }}\" stroke=\"{{ p1s }}\" stroke-width=\"1.6\">  an Astley chariot, a wheelbarrow, and a flying machine\""], ["Chicago", "Factory from 1847. By 1882 it turned out 46,000 machines a year"]], "photoCaption": "The 1831 reaper, rebuilt and run for the camera. From Casson's McCormick biography, 1909", "toBlueprint": "How does a walking horse work a saw?", "parts": [["Main wheel", "One big wheel carries the weight. As it rolls it drives the reel and the blade"], ["Reel", "Turns overhead. It lifts the stalks and leans them back onto the blade"], ["Blade and fingers", "A straight blade slides back and forth. A row of fingers holds the grain for the cut"], ["Platform", "Cut grain falls here. A man walks alongside and rakes it off in piles"]], "toPerson": "Who swung the hammer at that forge?", "personTitle": "The striker at the forge", "person": [["Who", "Jo Anderson, enslaved by the McCormicks and raised alongside Cyrus"], ["His job", "\"Blower and striker\" for the blacksmith building the reapers, in his own words"], ["On record", "Interviewed in 1885, aged 78. He said the reaper was Cyrus's, not the father's"], ["A caution", "The interviewer was close to McCormick. That likely shaped what Anderson felt safe saying"]], "canvas": [["Play up?", "The reel, big wooden paddles turning over a sea of wheat"], ["Glue on?", "Wheat straw, baling twine, a strip of old harness leather"]], "where": {"place": "Henry Ford Museum of American Innovation", "city": "Dearborn, Michigan", "note": "A model of the 1831 reaper, made by International Harvester, sits in the Agriculture exhibit", "url": "https://www.thehenryford.org/collections/explore/artifact/122394"}, "studio": {"work": "You painted Bandit Wood Chipper", "line": "Both do one job, feed the crop into moving knives"}, "asks": [["Did his father invent it?", "Robert McCormick tried for years and gave up. Cyrus took over in 1831. Some neighbors still credited Robert"], ["How much faster was it?", "The Chicago marker says about five times more wheat a day than hand work"], ["Is the forge still there?", "Yes. The blacksmith shop stands at McCormick Farm in Virginia, with 14 model reapers upstairs"]], "teaser": "a horse-drawn machine that London mocked, then gave its top prize", "also": [["Chicago", "A city marker to McCormick stands at 675 N Rush St"]], "personCaption": "Farmhands run McCormick's first self-rake reaper. Not Jo Anderson, no photo of him is used here. From Casson, 1909", "imgMachine": "img/reaper_machine.jpg", "imgPerson": "img/reaper_person.jpg", "bp": {"img": "img/bp_reaper.jpg", "cap": "A real one: Cyrus McCormick's reaper, patent drawing, June 21, 1834 (patent X8,277)"}, "svg": ""}, {"id": "u505", "name": "U-505 Submarine", "sub": "German Type IXC U-boat, captured June 4, 1944", "hook": "Nine sailors climbed into a sinking, booby-trapped sub to save it", "trick": "Diesels on the surface, batteries and electric motors underwater", "facts": [["Length", "About 250 feet"], ["Crew", "About 60"], ["The haul", "Code books and 2 Enigma machines"], ["A first", "First enemy warship the US Navy boarded since 1812"]], "photoCaption": "Sailors keep U-505 afloat, June 4, 1944. US Navy photo", "toBlueprint": "How do you stop a sub from sinking itself?", "parts": [["Conning tower", "The raised lookout on top. The boarding party went down this hatch"], ["Diesels", "Two 9-cylinder diesels for running on the surface"], ["Electric motors", "Battery power underwater. Under tow, the spinning propellers recharged the batteries"], ["Torpedo tubes", "Six tubes, about 22 torpedoes aboard"]], "toPerson": "Who went down the hatch first?", "personTitle": "The boarding party", "personCaption": "US Navy officers on U-505's conning tower, June 1944. US Navy photo", "person": [["Who", "Lt. Albert David, a former enlisted man"], ["The moment", "He led 9 men into a flooding sub rigged to explode"], ["Reward", "The Medal of Honor"], ["Chicago tie", "Capt. Daniel Gallery, a Chicago native, led the task group"]], "canvas": [["Play up?", "The open hatch and the rushing water"], ["Glue on?", "A brass valve, rope, code-grid paper"]], "where": {"place": "Griffin Museum of Science and Industry", "city": "Chicago", "note": "Here since 1954. You can step aboard", "url": "https://www.griffinmsi.org/exhibits/u-505-submarine"}, "also": [], "asks": [["Why keep it secret?", "So Germany wouldn't change its codes. It was towed to Bermuda in secret"], ["What happened to the crew?", "All but one were rescued and held as prisoners of war"], ["How did it get to Chicago?", "It was donated to the museum in 1954 and dedicated as a naval memorial"]], "imgMachine": "img/u505_machine.jpg", "imgPerson": "img/u505_person.jpg", "studio": {"work": "You painted the Mastercraft Wake Boat, 2025", "line": "Another hull with an engine inside, and a much friendlier one"}, "bp": {"img": "", "cap": ""}, "svg": "<path d=\"M0 104 Q20 98 40 104 T80 104 T120 104 T160 104 T200 104 T240 104 T280 104 T330 104\" fill=\"none\" stroke=\"#16324F\" stroke-opacity=\"0.45\"><\/path><path d=\"M14 116 Q40 96 82 96 L268 96 Q304 100 318 116 Q300 136 262 138 L72 138 Q34 136 14 116 Z\" fill=\"none\" stroke=\"#16324F\" stroke-width=\"1.6\"><\/path><path d=\"M140 96 L150 64 L198 64 L206 96 Z\" fill=\"{{ p1f }}\" stroke=\"{{ p1s }}\" stroke-width=\"1.6\"><\/path><line x1=\"174\" y1=\"64\" x2=\"174\" y2=\"40\" stroke=\"#16324F\"><\/line><rect x=\"210\" y=\"106\" width=\"40\" height=\"20\" rx=\"2\" fill=\"{{ p2f }}\" stroke=\"{{ p2s }}\" stroke-width=\"1.6\"><\/rect><rect x=\"256\" y=\"108\" width=\"24\" height=\"16\" rx=\"2\" fill=\"{{ p3f }}\" stroke=\"{{ p3s }}\" stroke-width=\"1.6\"><\/rect><rect x=\"20\" y=\"108\" width=\"34\" height=\"3\" fill=\"{{ p4s }}\"><\/rect><rect x=\"20\" y=\"114\" width=\"36\" height=\"3\" fill=\"{{ p4s }}\"><\/rect><rect x=\"22\" y=\"120\" width=\"34\" height=\"3\" fill=\"{{ p4s }}\"><\/rect><rect x=\"26\" y=\"126\" width=\"30\" height=\"3\" fill=\"{{ p4s }}\"><\/rect><rect x=\"286\" y=\"112\" width=\"24\" height=\"3\" fill=\"{{ p4s }}\"><\/rect><rect x=\"286\" y=\"119\" width=\"22\" height=\"3\" fill=\"{{ p4s }}\"><\/rect><circle cx=\"128\" cy=\"56\" r=\"10\" fill=\"{{ b1f }}\" stroke=\"#16324F\" stroke-width=\"1.2\"><\/circle><text x=\"128\" y=\"60\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"{{ b1t }}\" stroke=\"none\">1<\/text><circle cx=\"230\" cy=\"160\" r=\"10\" fill=\"{{ b2f }}\" stroke=\"#16324F\" stroke-width=\"1.2\"><\/circle><text x=\"230\" y=\"164\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"{{ b2t }}\" stroke=\"none\">2<\/text><circle cx=\"268\" cy=\"160\" r=\"10\" fill=\"{{ b3f }}\" stroke=\"#16324F\" stroke-width=\"1.2\"><\/circle><text x=\"268\" y=\"164\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"{{ b3t }}\" stroke=\"none\">3<\/text><circle cx=\"38\" cy=\"160\" r=\"10\" fill=\"{{ b4f }}\" stroke=\"#16324F\" stroke-width=\"1.2\"><\/circle><text x=\"38\" y=\"164\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"{{ b4t }}\" stroke=\"none\">4<\/text>", "teaser": "a U-boat the US Navy captured and towed home"}, {"id": "bellhowell", "name": "Bell & Howell 2709", "sub": "Bell & Howell Co, Chicago, 1912", "hook": "By 1919 nearly every Hollywood movie ran through this one Chicago camera", "trick": "The film gets pulled down by moving pins, then shifted onto fixed pins. Each frame sits dead still while it is exposed", "facts": [["Body", "Machined from cast aluminum"], ["Made", "1912 to 1958, about 1,225 built"]], "photoCaption": "Twin round magazines and a lens turret, the look of a 2709. Bucharest, 1920. Red Cross collection, Library of Congress", "toBlueprint": "How do you hold moving film perfectly still?", "parts": [["Cam and rocker arm", "A cam rocks an arm that shifts the film guide back and forth"], ["Moving pins", "They slide into the perforations and pull the film down one frame"], ["Fixed pins", "The guide shifts the film onto these. They hold the frame for the exposure"], ["Four lens turret", "Spin it to swap lenses. The first camera to have one"]], "toPerson": "Who taught a queen to crank one?", "personTitle": "The cameraman and the queen", "person": [["Who", "Merl LaVoy of Seattle, a Red Cross cameraman in Romania"], ["The student", "Queen Marie had film stories of her own she hoped to shoot"], ["The designer", "Albert Howell, a Chicago machinist. He founded the firm with Donald Bell in 1907"], ["The gripe", "Cameramen hated the finder. It showed the picture upside down"]], "canvas": [["Play up?", "The two round magazines on top, big as mouse ears"], ["Glue on?", "Strips of old 35mm film, black crinkle paint chips, a brass nameplate"]], "where": {"place": "George Eastman Museum", "city": "Rochester, New York", "note": "It holds 2709 Model B cameras. Ask ahead which ones are on view", "url": "https://collections.eastman.org/objects/81257/"}, "studio": {"work": "You painted Bridgeport Mill", "line": "This camera body was machined from an aluminum casting, a job your Bridgeport would know"}, "asks": [["Why did it last 46 years?", "The film sat so steady that animators and effects crews used it into the 1980s"], ["Who bought them?", "Studios, mostly. Charlie Chaplin was one of the few people who owned one"], ["What happened to Bell?", "In 1917 he fired Howell and the manager. Next day they bought him out"]], "teaser": "a Chicago camera that held every frame on steel pins and took over Hollywood", "also": [["Chicago", "Chicago History Museum owns a 1939 Bell & Howell Filmo. Ask if it is on view"], ["Los Angeles", "The ASC Clubhouse in Hollywood keeps serial 1050. Not a walk-in museum, so ask first"]], "personCaption": "Merl LaVoy shows Queen Marie of Romania his camera at the palace in Bucharest, 1920. American National Red Cross collection, Library of Congress", "imgMachine": "img/bellhowell_machine.jpg", "imgPerson": "img/bellhowell_person.jpg", "bp": {"img": "img/bp_bellhowell.jpg", "cap": "A real one: Fig 1 of Albert S Howell's Motion Picture Machine, US patent 1,038,586, 1912"}, "svg": ""}, {"id": "jacquard", "name": "Jacquard loom", "sub": "Joseph Marie Jacquard, Lyon, 1804", "hook": "In 1804 a loom took its orders from holes punched in cards", "trick": "One card per row of pattern. Hole or blank decides which hooks lift", "facts": [["In use by 1812", "Said to be 11,000 looms in France"], ["Speed", "From an inch of fancy silk a day to about two feet"], ["His reward", "A pension and a royalty on every machine"], ["Show piece", "His portrait in silk took 24,000 cards"]], "photoCaption": "Jacquard looms weaving patterned cloth at Muscogee Mills, Columbus, Georgia, 1977. HAER, Library of Congress", "toBlueprint": "How does a card lift a thread?", "parts": [["Card chain", "Cards laced edge to edge in a loop. Swap the deck and you swap the pattern"], ["Cylinder", "Turns one card at a time and presses it against a bank of pins"], ["Pins", "They feel for holes. Hole or blank sets each hook in or out of play"], ["Hooks", "The chosen hooks rise and pull up their warp threads for the shuttle"]], "toPerson": "Why did weavers burn it?", "personTitle": "The inventor", "person": [["Who", "Joseph Marie Jacquard, a Lyon silk weaver, 1752 to 1834"], ["The weavers", "Lyon silk weavers feared for their jobs. They burned looms and attacked him"], ["The state", "About 1805 the loom became public property. He got a pension and royalties"], ["The heirs", "Babbage took the cards for his Analytical Engine. Hollerith used them on the 1890 census"]], "canvas": [["Play up?", "The card chain, looping down over the weaver like a paper waterfall"], ["Glue on?", "Punched card stock, silk thread, a scrap of damask"]], "where": {"place": "Greenfield Village Weaving Shop, The Henry Ford", "city": "Dearborn, Michigan", "note": "Built in the Village shop in 1934, with 622 cards. Check hours first", "url": "https://www.thehenryford.org/collections/explore/artifact/354319"}, "studio": {"work": "You painted Spinning Jenny (2026)", "line": "The jenny made thread by the armful. This loom told each thread where to go"}, "asks": [["Was Jacquard first with cards?", "No. Bouchon, Falcon and Vaucanson tried it first. Jacquard made it work"], ["What did Ada Lovelace say?", "The Analytical Engine \"weaves algebraical patterns just as the Jacquard-loom weaves flowers and leaves\""], ["Did weavers like it?", "No. Lyon silk weavers feared for their jobs and fought it at first"]], "teaser": "a loom that took its orders from holes punched in cards", "also": [], "personCaption": "Jacquard at his bench, from the 1839 memorial portrait made by Didier Petit of Lyon. Library of Congress", "imgMachine": "img/jacquard_machine.jpg", "imgPerson": "img/jacquard_person.jpg", "bp": {"img": "img/bp_jacquard.jpg", "cap": "A real one: hooks and needles inside a Jacquard head, Thomas Halton, US patent 185,027, 1876"}, "svg": ""}, {"id": "cable", "name": "San Francisco Cable Car", "sub": "Andrew Hallidie, Clay Street, 1873", "hook": "No engine on board. Each car grabs a cable running under the street", "trick": "One cable moves at a steady 9.5 mph. The car goes as fast as the grip lets it", "facts": [["First run", "Aug 2, 1873, 4 am"], ["Cable speed", "9.5 mph, always"], ["Powerhouse", "Winding wheels, 510-hp motors"], ["Chicago tie", "Chicago once ran the largest system"]], "photoCaption": "Winding wheels that drive the cables. Photo: HAER, Library of Congress", "toBlueprint": "How do you grab a moving cable?", "parts": [["Winding wheels", "Giant wheels in the powerhouse pull loops of cable at 9.5 mph"], ["Cable", "Runs in a channel under the street. You only see the slot"], ["Grip", "A 300-plus-pound set of pliers that reaches down through the slot"], ["Brakes", "Wheel, track, and an emergency 18-inch steel wedge jammed into the slot"]], "toPerson": "Who had the nerve to drive it first?", "personTitle": "The gripman", "personCaption": "Gripman and conductor turning a car. Photo: HAER, Library of Congress", "person": [["Who", "The gripman, who clamps and  the ceiling corner, bedding and all", "trick": "The upper berth is hinged to the car wall. It swings up by day and traps the bedding behind it", "facts": [["Patent", "No. 49,992, Field and Pullman, September 19, 1865"], ["The Pioneer", "A foot wider and 2.5 feet taller than other cars, to fit the berth"], ["Cost", "About $18,000 to $20,000, several times any other sleeper"], ["The deal", "Pullman leased the cars to railroads, crew included"]], "photoCaption": "One of the first cars George Pullman built. From The Story of the Pullman Car, 1917", "toBlueprint": "Where does the bed go at breakfast?", "parts": [["Seat cushions", "Seat and back are hinged together. Lay the back flat, slide the seat out to meet the facing one"], ["Upper berth", "Hinged to the side of the car. At night it drops level"], ["Jointed hangers", "Folding suspenders carry the outer edge of the berth"], ["Spring catch", "By day it holds the berth tilted up. The bedding rides in the corner behind it"]], "toPerson": "Who made all those beds every night?", "personTitle": "The Pullman porter", "person": [["Who", "Black men, at first many freed from slavery. Over 10,000 porters by 1926"], ["The hours", "About 400 hours or 11,000 miles a month. Sleep time came out of their pay"], ["The name", "Riders called every porter George. Of 12,000 porters and waiters, 362 really were"], ["The win", "Their union, formed in 1925, won a Pullman contract in 1937"]], "canvas": [["Play up?", "White sheets and a white jacket glowing against dark car walls"], ["Glue on?", "Heavy curtain cloth, brass hardware, a page from an old timetable"]], "where": {"place": "Pullman National Historical Park", "city": "Chicago", "note": "Visitor center is in the factory clock tower, open daily, shorter hours in winter", "url": "https://www.nps.gov/thingstodo/visit-the-national-park-service-pullman-visitor-center.htm"}, "studio": {"work": "You painted Mastercraft Wake Boat (2025)", "line": "Both squeeze living room comfort into a narrow moving shell"}, "asks": [["Did it carry Lincoln?", "Pullman lore puts the Pioneer on Lincoln's funeral train. The 1917 company history only says \"it is said\""], ["Why a company town?", "Pullman built it in 1880 beside the works. Rents were set to return 6 percent"], ["Where can I see a real one?", "Illinois Railway Museum in Union keeps restored Pullman sleepers in Barn 3. Open in season"]], "teaser": "a railroad car that hides its beds up in the ceiling by day", "also": [], "personCaption": "A porter makes up an upper berth on the Capitol Limited, bound for Chicago, 1942. US Office of War Information, Library of Congress", "imgMachine": "img/pullman_machine.jpg", "imgPerson": "img/pullman_person.jpg", "bp": {"img": "img/bp_pullman.jpg", "cap": "A real one: Field and Pullman's sleeping car, cross section, patent 49,992, 1865"}, "svg": ""}, {"id": "dishwasher", "name": "Garis-Cochran dishwasher", "sub": "Josephine Cochran, Shelbyville, Illinois, 1886", "hook": "A broke Illinois widow built it in a woodshed, then won the 1893 fair", "trick": "She quit scrubbing. Dishes sit still in wire racks made to fit them, and hot soapy water is pumped at them", "facts": [["Patent", "No. 355,139, Dec 28, 1886"], ["Speed", "The big model did 240 dishes in two minutes"], ["At the fair", "Nine of them ran in the 1893 fair's restaurants"], ["First order", "Chicago's Palmer House hotel, 1887"]], "photoCaption": "The Garis-Cochran machine in a company ad, mid 1890s. An engraving, not a photo. Via USPTO, public domain", "toBlueprint": "How do you wash plates without touching them?", "parts": [["Wire racks", "Bent to fit plates, cups and saucers so nothing rattles or chips"], ["Wheel", "The racks sit in a wheel that lies flat inside a copper boiler"], ["Pump", "It forces hot soapy water up from the bottom of the boiler"], ["Rain", "The water squirts through the racks and rains back down on the dishes"]], "toPerson": "Who was the woman in the woodshed?", "personTitle": "The inventor", "person": [["Who", "Josephine Garis Cochran, 1839 to 1913. Her father was a civil engineer"], ["The push", "Her husband died in 1883 and left about $1,500 and a pile of debt"], ["Her helper", "George Butters, a young mechanic. He later ran her factory"], ["Her words", "\"If nobody else is going to invent a dishwashing machine, I'll do it myself\""]], "canvas": [["Play up?", "Plates frozen in a wire cage while hot water explodes around them"], ["Glue on?", "Copper sheet, bent wire, a chipped piece of china"]], "where": {"place": "Josephine Cochran marker, 148 S Broadway St", "city": "Shelbyville, Illinois", "note": "It marks where the woodshed stood. Private yard, so look from the walk. No machine here", "url": "https://www.hmdb.org/m.asp?m=188364"}, "studio": {"work": "You painted Centrifugal Pump (2025)", "line": "Her whole idea was a pump job: let moving water do the work"}, "asks": [["Why did homes wait so long?", "Most houses had no boiler big enough for the hot water it needed"], ["Is her company still around?", "Hobart bought it in 1926 and sold the machines as KitchenAid"], ["Hardest sale?", "Walking into the Sherman House alone. \"I thought I should faint at every step\""]], "teaser": "a woodshed machine from Illinois that washed 240 dishes in two minutes", "also": [], "personCaption": "Josephine Cochran at her desk, later in life. Via USPTO, public domain", "imgMachine": "img/dishwasher_machine.jpg", "imgPerson": "img/dishwasher_person.jpg", "bp": {"img": "img/bp_dishwasher.jpg", "cap": "A real one: Fig. II of Josephine Cochran's dish washing machine, US patent 355,139, 1886"}, "svg": ""}, {"id": "corliss", "name": "Corliss Centennial engine", "sub": "George Corliss, Providence, 1876", "hook": "The star of the 1876 world's fair spent 30 years running a Chicago rail car plant", "trick": "Four rotary valves, two for steam, two for exhaust. The governor sets the cutoff, so speed holds as the load swings", "facts": [["Size", "About 45 feet tall, flywheel 30 feet across with a 24 inch face"], ["Power", "Usually given as 1,400 hp at 36 rpm. The Pullman history site says 2,500"], ["Fuel", "Used far less coal than engines before it"], ["Chicago", "Pullman paid $77,000 and needed a 35 car train to bring it home"]], "photoCaption": "The Corliss engine in Machinery Hall, Philadelphia, 1876. Centennial Photographic Co. stereograph, Library of Congress", "toBlueprint": "How do you hold speed when the load jumps?", "parts": [["Governor", "Fly balls sense the speed and move the cutoff gear early or late"], ["Steam valves", "Two rotary valves let steam in fast, then shut at the cutoff the governor picks"], ["Exhaust valves", "Two more rotary valves let the spent steam out. Each job gets its own valve"], ["Flywheel", "On the big one it was also a gear, 30 feet across, driving the line shaft"]], "toPerson": "Who started it, and who started it again?", "personTitle": "The people at the lever", "person": [["Who", "George Corliss left school at 14 and clerked in a general store"], ["First patent", "A machine for stitching boots. He went to Providence for money and found steam"], ["The robin", "He once held up a boiler delivery because a robin nested in the wagon wheel"], ["In Chicago", "Florence Pullman started the engine at the car works on April 2, 1881"]], "canvas": [["Play up?", "The A-frame towering over a crowd of tiny top hats"], ["Glue on?", "Leather belting, an old railroad timetable, coal dust"]], "where": {"place": "The Henry Ford Museum", "city": "Dearborn, Michigan", "note": "Their 1859 Corliss is the only one left that his company built in his lifetime", "url": "https://www.thehenryford.org/collections/explore/articles/1859-corliss-steam-engine"}, "studio": {"work": "You painted Ingersoll Rand Gas Compressor at Seattle Gas Works", "line": "Another big piston machine built to keep a whole plant running"}, "asks": [["Did Pullman really buy it?", "Yes. The Pullman history site says he bought it in 1880. It ran the car works until fall 1910"], ["What did it drive at Pullman?", "About 3,268 feet of main shafting in tunnels, 13,000 feet overhead and two miles of belting"], ["Why was it scrapped?", "Electricity replaced steam at the works. The engine was sold for scrap in 1910"]], "teaser": "a steam engine that ran a world's fair, then a Chicago factory", "also": [["Chicago", "Pullman National Historical Park. The engine is gone, scrapped in 1910. The clock tower visitor center overlooked Lake Vista, its cooling pond"]], "personCaption": "President Grant and Dom Pedro of Brazil starting the engine, May 1876. Engraving from Harper's Weekly, Library of Congress", "imgMachine": "img/corliss_machine.jpg", "imgPerson": "img/corliss_person.jpg", "bp": {"img": "img/bp_corliss.jpg", "cap": "A real one: sheet 1 of George Corliss's steam engine patent, No. 6,162, 1849"}, "svg": ""}, {"id": "pinball", "name": "Pinball machine", "sub": "Gottlieb, Bally and Williams, Chicago, 1931 on", "hook": "For 16 years pinball had no flippers. You shot the ball and watched", "trick": "Humpty Dumpty in 1947 gave the player buttons. They fired six small electric bats that knocked the ball back up", "facts": [["Baffle Ball", "Gottlieb, 1931, $17.50 a machine, a penny a game"], ["Output", "Gottlieb built 400 a day at the peak"], ["First flippers", "Humpty Dumpty, Oct 25, 1947"], ["Chicago ban", "Pinball was banned here for about 30 years, until 1977"]], "photoCaption": "A flipperless pinball machine at the Catholic Sokol Club, Ambridge, Pennsylvania, 1941. John Vachon, FSA, Library of Congress", "toBlueprint": "What did pinball look like in 1871?", "parts": [["Plunger", "A spring rod shoots the ball. It came from a 1700s European table game"], ["Pins", "The ball rattles down a tilted board through pins and holes"], ["Coin slot and glass", "Added in 1931, so a bar could earn a penny a game"], ["Flippers", "Added in 1947. Three weak pairs that faced outward, spread up the board"]], "toPerson": "Who gave the player a fighting chance?", "personTitle": "The flipper man", "person": [["Who", "Harry Mabs, designer at D. Gottlieb & Co"], ["His game", "Humpty Dumpty, 1947. Gottlieb built 6,500 of them"], ["The rival", "Ray Moloney could not get enough Baffle Balls, so he built Ballyhoo and started Bally"], ["The skeptics", "New York banned pinball until 1976, when a player called his shot in a hearing"]], "canvas": [["Play up?", "The ball as a comet, six flippers swatting at it like cat paws"], ["Glue on?", "Steel balls, rubber rings, a penny, bits of painted plywood"]], "where": {"place": "Galloping Ghost Pinball", "city": "Brookfield, Illinois", "note": "Close to Oak Park. A listing shows over 45 machines and a $20 flat fee. Check first", "url": "https://gallopingghostpinball.com/"}, "studio": {"work": "You painted Yamaha Guitar", "line": "Both are machines built only for play, with the art right on the wood"}, "asks": [["Why Chicago?", "By the end of 1932 about 150 firms made pinball, most of them in Chicago"], ["Still made here?", "Yes. Chicago has stayed the center of pinball making"], ["When did flippers move down?", "1948, on Genco's Triple Action. Two at the bottom, still facing outward"]], "teaser": "a Chicago game that was banned in its own city for 30 years", "also": [], "personCaption": "Steelworkers play at the Serbian Club in Aliquippa, Pennsylvania, 1941. Jack Delano, FSA, Library of Congress", "imgMachine": "img/pinball_machine.jpg", "imgPerson": "img/pinball_person.jpg", "bp": {"img": "img/bp_pinball.jpg", "cap": "A real one: Montague Redgrave's improvement in bagatelles, US patent 115,357, 1871"}, "svg": ""}, {"id": "otis", "name": "Otis safety elevator", "sub": "Elisha Otis, Yonkers, New York, 1850s", "hook": "He stood on the platform, high in the air, and had the rope cut", "trick": "Rope tension holds the catches back. Lose the rope and a spring throws them into toothed rails", "facts": [["The spring", "A used wagon spring, fixed on top of the platform"], ["The demo", "New York Crystal Palace, 1854. The platform dropped only a few inches"], ["First store", "Haughwout's store in Manhattan put one in service on March 23, 1857"], ["Patent", "No. 31,128, January 15, 1861. Otis died that April"]], "photoCaption": "An Otis belt and geared steam freight elevator engine. Otis Elevator Company catalog, 1903", "toBlueprint": "What catches the car when the rope lets go?", "parts": [["Hoist rope", "Lifts the platform. Its pull also tugs a rod and a pair of levers on the frame"], ["Pawls", "Two catches on the frame. While the rope pulls, the levers hold them clear"], ["Toothed racks", "Saw-tooth rails fixed up both sides of the shaft"], ["Spring", "When the pull stops it snaps the pawls into the racks. The platform stays put"]], "toPerson": "Who trusts his own brake with his neck?", "personTitle": "The showman mechanic", "person": [["Who", "Elisha Otis, born 1811 in Vermont. A master mechanic in a bedstead factory"], ["The need", "His Yonkers shop needed a hoist to the upper floor. Workers feared them, ropes broke"], ["The stunt", "He rode it up at the 1854 fair and had the rope cut. Then the orders came"], ["Legend says", "He called out \"All safe, gentlemen\". Sources differ on the words, and on axe or saber"]], "canvas": [["Play up?", "The cut rope end flying loose, and the platform hanging dead still"], ["Glue on?", "Hemp rope, a leaf of old spring steel, a hacksaw blade for the rack"]], "where": {"place": "Fine Arts Building, 410 S Michigan Ave", "city": "Chicago", "note": "Its 1898 hand-run Otis cars were being replaced. Call first, (312) 566-9800", "url": "https://www.fineartsbuilding.com/visit/"}, "studio": {"work": "You painted Ballard Locks (2026)", "line": "Both raise a heavy load straight up, gently, all day long"}, "asks": [["Did Otis invent the elevator?", "No. Hoists were old news, and they dropped people. He made one that could not fall"], ["Was it 1853 or 1854?", "Most accounts say 1854. PBS says 1853"], ["Why did Chicago care?", "Top floors used to rent cheapest. Safe lifts flipped that, and buildings could grow tall"]], "teaser": "a brake that only wakes up when everything else has failed", "also": [], "personCaption": "Otis at the Crystal Palace with the rope cut. Old engraving, artist unknown, via Wikimedia Commons", "imgMachine": "img/otis_machine.jpg", "imgPerson": "img/otis_person.jpg", "bp": {"img": "img/bp_otis.jpg", "cap": "A real one: E. G. Otis, Hoisting Apparatus, patent 31,128, 1861"}, "svg": ""}, {"id": "loco999", "name": "Locomotive No. 999", "sub": "New York Central, West Albany, 1893", "hook": "Seven foot wheels, a few stopwatches, and a speed claim nobody can prove", "trick": "Buchanan took his stock 4-4-0 and swapped 70 inch drivers for 86 inch ones. More ground per turn, less grip", "facts": [["The claim", "112.5 mph on May 10, 1893, near Buffalo"], ["Timed by", "Men with hand stopwatches watching the mileposts"], ["Boiler", "About 180 psi working pressure"], ["The catch", "It slipped with more than five cars, so it got 70 inch drivers"]], "photoCaption": "No. 999 on its tall drivers, as shown at the 1893 World's Fair. Library of Congress", "toBlueprint": "What makes a steam engine a sprinter?", "parts": [["Boiler", "Makes steam at about 180 psi"], ["Tall drivers", "Four 86 inch wheels cover a lot of track with each turn"], ["Front truck", "Four small wheels lead the way. The first of its kind with brakes there"], ["Tender", "Carries coal and water, lettered in gold leaf two and a half feet high"]], "toPerson": "Who had his hand on the throttle?", "personTitle": "The engineer", "person": [["Who", "Charles Hogan of Batavia, with fireman Ike O'Dell"], ["Start", "He began at 14 as a water boy for the railroad"], ["His record", "The railroad said he never hit a cow in 25 years"], ["After", "He ran the Buffalo shops and worked until he was 89"]], "canvas": [["Play up?", "Drivers taller than the crew, with the man beside them for scale"], ["Glue on?", "Coal dust, gold leaf scraps, an old timetable page"]], "where": {"place": "Griffin Museum of Science and Industry", "city": "Chicago", "note": "Look at the drivers. These are the later 70 inch set, not the record 86s", "url": "https://collections.griffinmsi.org/collections/8313"}, "studio": {"work": "You painted Felt and Trek racing bikes", "line": "Same idea as a tall gear on a race bike. More distance per turn, harder to get rolling"}, "asks": [["Did it really hit 112.5?", "Nobody knows. It was hand timed over one mile and never proven"], ["Why was it built?", "As a showpiece. A railroad man wanted publicity at the 1893 Chicago fair"], ["How did it end up here?", "It finished its career hauling milk cars. New York Central gave it to the museum in 1962"]], "teaser": "a steam engine with seven foot wheels and a speed record nobody can prove", "also": [], "personCaption": "The Empire State Express behind 999, dated May 10, 1893, the day of the claim. A P Yates, Library of Congress", "imgMachine": "img/loco999_machine.jpg", "imgPerson": "img/loco999_person.jpg", "bp": {"img": "", "cap": ""}, "svg": ""}, {"id": "singer", "name": "Singer sewing machine", "sub": "Isaac Singer, Boston, patented 1851", "hook": "A sometime actor built it in eleven days on a backer's forty dollars", "trick": "A straight needle works up and down over a flat table. A pinned wheel feeds the cloth", "facts": [["Patent", "No. 8,294, August 12, 1851"], ["First try", "Five stitches, then the thread snapped"], ["Paid to Howe", "$15,000 in 1854, for a license"], ["Sold in 1875", "About 250,000, more than double its nearest rival"]], "photoCaption": "An early I. M. Singer & Co machine, photographed about 1940. Harris & Ewing, Library of Congress", "toBlueprint": "How do two threads lock?", "parts": [["Treadle", "Heel and toe on a pivoted board. Both hands stay free to guide the cloth"], ["Needle", "Straight, with the eye at the point. An overhead shaft drives it up and down"], ["Shuttle", "Slides back and forth under the table with a second thread, locking each stitch"], ["Feed wheel", "Short pins poke up through a slot and walk the cloth along"]], "toPerson": "Who got to own one?", "personTitle": "The home sewer", "person": [["Who", "Tailors and factories came first. The 1851 machine was built for the trades"], ["Home model", "The first family machine came in 1858. Workers called it the Grasshopper"], ["Pay later", "Partner Edward Clark let families buy on installments, a first in the US"], ["The showroom", "Carved walnut, gilt and carpet. Young women ran the machines for the crowd"]], "canvas": [["Play up?", "The feet. Hands calm on the cloth while the legs do all the work"], ["Glue on?", "Thread, a tissue dress pattern, a strip of muslin"]], "where": {"place": "National Museum of American History", "city": "Washington, DC", "note": "Singer's 1851 patent model is listed in the American Enterprise exhibition", "url": "https://www.si.edu/object/nmah_1071133"}, "studio": {"work": "You painted Bridgeport Mill", "line": "Early Singer parts were filed by hand to fit. Mill work, later on"}, "asks": [["Who was Elias Howe?", "He patented the eye-pointed needle with a shuttle in 1846. Then he sued Singer"], ["What ended the patent war?", "A patent pool in 1856. One fee per machine, and it fell over time"], ["Could he patent the treadle?", "No. It had been in public use for two years, so it was too late"]], "teaser": "a machine a sometime actor built in eleven days, then sold on installments", "also": [], "personCaption": "A woman sewing at a Singer machine, 1917 or 1918. Library of Congress", "imgMachine": "img/singer_machine.jpg", "imgPerson": "img/singer_person.jpg", "bp": {"img": "img/bp_singer.jpg", "cap": "A real one: sheet 1 of Isaac Singer's sewing machine patent, No. 8,294, 1851"}, "svg": ""}, {"id": "steamshovel", "name": "Steam shovel", "sub": "Bucyrus and Marion, Panama Canal, 1904 to 1914", "hook": "The man who invented it died at 26, the same year he got the patent", "trick": "A boiler on a rail car works a boom, a dipper stick and a toothed bucket. Pull a pin and the load drops", "facts": [["At Panama", "102 steam shovels. Bucyrus built 77, Marion the rest"], ["Biggest", "95 tons, with a dipper that took up to 5 cubic yards a bite"], ["Shift", "Ten hours a day, six days a week, in stiff clay and blasted rock"], ["Lost", "Officially, the drawing for Otis's 1839 patent is missing"]], "photoCaption": "Steam shovel No. 230 at work on the Panama Canal, about 1905 to 1914. Detroit Publishing Co., Library of Congress", "toBlueprint": "How does one bite of rock get to the train?", "parts": [["Boom", "Sits on the front of the car and carries the dipper and its rigging"], ["Dipper stick", "Slides out and in on the boom to push the bucket into the bank. That push is the crowd"], ["Bucket", "Toothed lip digs in. A locking pin lets the flap swing open to dump"], ["Swing", "The boom swings the load over to a rail car, then back for another bite"]], "toPerson": "Who climbed into the seat in a white suit?", "personTitle": "The president at the levers", "person": [["Who", "William Otis built the first one at 22. His cousin Elisha made the elevators"], ["His patent", "No. 1,089, a crane excavator for digging railroad cuts, dated 1839"], ["His end", "Typhoid fever, November 1839. He was 26"], ["The crew", "Usually three or more. An engineer, a fireman and a ground man moving rail and timber"]], "canvas": [["Play up?", "The bucket's teeth, huge, mid bite, with the crew tiny below"], ["Glue on?", "Rusty chain links, red clay, a scrap of rail timetable"]], "where": {"place": "IUOE Local 150, Joliet Road", "city": "Countryside, Illinois", "note": "A restored 1925 Erie Type B that still steams, on old Route 66. Call first, no visiting hours are posted", "url": "https://local150.org/news/steamshovel/"}, "studio": {"work": "You painted Keystone Drilling Machine (2026)", "line": "Another rig built to bite into the ground for a living"}, "asks": [["Why did it take so long to catch on?", "One account says the Otis family held the patent tight for decades"], ["Who made them full swing?", "The first shovel that could turn a full circle came from England in 1884"], ["What killed steam?", "Diesel shovels in the 1930s. They were simpler and cheaper to run"]], "teaser": "a boiler on rails that took a hill apart five yards at a time", "also": [], "personCaption": "Theodore Roosevelt at the controls of a steam shovel, Culebra Cut, November 1906. Underwood and Underwood stereograph, Library of Congress", "imgMachine": "img/steamshovel_machine.jpg", "imgPerson": "img/steamshovel_person.jpg", "bp": {"img": "img/bp_steamshovel.jpg", "cap": "A real one: C. M. Harrison's steam shovel patent, No. 716,538, 1902. Otis's own 1839 drawing is lost"}, "svg": ""}, {"id": "strowger", "name": "Strowger telephone switch", "sub": "Almon Strowger, first exchange La Porte, Indiana, 1892", "hook": "An undertaker, sure the operators were losing his calls, built a machine to replace them", "trick": "Each digit is a burst of pulses. One magnet ratchets a shaft up, a second turns it. Ten levels by ten contacts is 100 lines", "facts": [["Patent", "No. 447,918, March 10, 1891"], ["First exchange", "La Porte, Indiana, Nov 3, 1892, about 75 phones"], ["Sales pitch", "\"Girl-less, cuss-less and wait-less\""], ["His payout", "$1,800 for the patents. They resold for $2.5 million in 1916"]], "photoCaption": "Strowger switches at the Telephone Museum in Waltham, Massachusetts, 2018. Daderot, Wikimedia Commons, CC0", "toBlueprint": "How do clicks pick one line out of 100?", "parts": [["Dial", "Digits 1 to 9 send that many pulses. Zero sends ten"], ["Vertical magnet", "The first pulse train works a pawl that lifts the shaft to one of ten levels"], ["Rotary magnet", "The second train turns the shaft to one of ten contacts on that level"], ["Release magnet", "At hang up it frees the pawls. A spring swings the shaft home, then gravity drops it"]], "toPerson": "Why would an undertaker hate operators?", "personTitle": "The angry undertaker", "person": [["Who", "Almon Strowger, Kansas City undertaker, 1839 to 1902"], ["The story", "A rival's wife ran the switchboard and sent his calls away. Often told, never proven"], ["Another take", "A Bell manager blamed a metal sign that shorted his line when the wind blew"], ["First model", "A round collar box stuck with straight pins"]], "canvas": [["Play up?", "A whole wall of switches stepping at once, like a brass insect colony"], ["Glue on?", "Old phone wire, a dial finger wheel, straight pins, a collar box lid"]], "where": {"place": "Connections Museum", "city": "Seattle", "note": "Open Sundays 10 to 3. Ask a docent to run the step by step gear", "url": "https://www.telcomhistory.org/ConnectionsSeattle.html"}, "studio": {"work": "You painted CNC Metalworking Lathe (2026)", "line": "Same idea, 80 years early: a train of pulses moves two axes to a spot"}, "asks": [["Where does Chicago come in?", "Automatic Electric was set up in Chicago in 1901 to build the system"], ["Did he get rich?", "No. He sold his share for $10,000 in 1898 and died in 1902"], ["Who made the dial?", "Keith and the Erickson brothers. They filed for the finger wheel dial in 1896"]], "teaser": "an undertaker's revenge machine that put telephone operators out of work", "also": [["Illinois", "Aurora Regional Fire Museum holds a 1905 Strowger dial phone. Call first to see if it is out"]], "personCaption": "Carl Mitman tries the automatic telephone at the Smithsonian, 1924. Harris & Ewing, Library of Congress", "imgMachine": "img/strowger_machine.jpg", "imgPerson": "img/strowger_person.jpg", "bp": {"img": "img/bp_strowger.jpg", "cap": "A real one: sheet 3 of Almon Strowger's automatic telephone exchange, US patent 447,918, 1891"}, "svg": ""}, {"id": "lcar", "name": "Chicago L car No. 1", "sub": "Jackson & Sharp, 1892", "hook": "An elevator man made every car in the train pull its own weight", "trick": "Sprague put motors on each car and tied them to one handle. Relays in every car obey the motorman up front", "facts": [["Built as", "A wooden trailer hauled by steam, one of 180"], ["Size", "46 feet long, 42,500 pounds"], ["First fare", "5 cents, 39th Street to downtown in 14 minutes"], ["Steam ended", "July 27, 1898"]], "photoCaption": "L cars on the elevated over Wabash Avenue, 1900 to 1910. Not car No. 1 itself. Detroit Publishing Co, Library of Congress", "toBlueprint": "How does one man drive a whole train of motors?", "parts": [["Controller handle", "The motorman works one controller in the cab of the lead car"], ["Train line wires", "Wires run car to car and carry his commands down the train"], ["Relays", "Relays in each car switch that car's own motors"], ["Motors", "Car 1 got two motors on one truck in the 1897 to 1898 rebuild"]], "toPerson": "Who bet a whole railroad on an untested idea?", "personTitle": "The inventor", "person": [["Who", "Frank J Sprague, Naval Academy man, called the father of electric traction"], ["Before", "He left Edison in 1884. Sprague wanted to build motors and electric railways"], ["The spark", "Controlling electric elevators gave him the idea for trains"], ["The gamble", "The South Side L was the first railroad in the world to try it"]], "canvas": [["Play up?", "The steel legs of the L marching down an alley, the car small on top"], ["Glue on?", "Old CTA transfers, varnished wood veneer, a strip of copper wire"]], "where": {"place": "Chicago History Museum", "city": "Chicago", "note": "Car No. 1 greets you at the door of Crossroads of America, 2nd floor", "url": "https://www.chicagohistory.org/exhibition/chicago-crossroads-of-america/"}, "studio": {"work": "You painted Ballard Locks (2026)", "line": "Both were built for one job, keeping a city's daily traffic moving"}, "asks": [["How did it get upstairs?", "In 2006 a crane lifted it. Crews rolled it in through a hole in the wall"], ["What pulled it at first?", "Baldwin steam engines. The car got its heat from them and had gas lights"], ["Why does this matter today?", "Rapid transit trains still run on Sprague's idea of one driver and many motors"]], "teaser": "a wooden rail car from the first train with a motor in every car", "also": [], "personCaption": "Frank Sprague, center, stands behind his old boss Thomas Edison, about 1910 to 1915. Bain News Service, Library of Congress", "imgMachine": "img/lcar_machine.jpg", "imgPerson": "img/lcar_person.jpg", "bp": {"img": "img/bp_lcar.jpg", "cap": "A real one: three coupled cars and their controls, Frank J Sprague, US patent 660,065, 1900"}, "svg": ""}, {"id": "typewriter", "name": "Sholes & Glidden typewriter", "sub": "Milwaukee, built by Remington, 1874", "hook": "Gunmakers built it like a sewing machine, foot treadle and all", "trick": "All the typebars hit one printing point. Letters were scattered so neighbors would not clash", "facts": [["Price", "$125, when a pen cost a penny"], ["Letters", "Capitals only. No shift key until 1878"], ["Typing blind", "The bars struck from below, so you could not see the line"], ["Sold by 1877", "About 4,000"]], "photoCaption": "The Remington Model 1 shown at the 1876 Centennial, flowers and all. From The Story of the Typewriter, 1923", "toBlueprint": "Why could you not see your typing?", "parts": [["Key lever", "Press a key and a lever throws its typebar"], ["Typebar", "Swings up and hits the paper from underneath, at one common point"], ["Ribbon", "An inked ribbon sits between the type and the paper"], ["Carriage", "Steps one space per stroke. On the first model a foot treadle sent it back"]], "toPerson": "Who typed first?", "personTitle": "The first typist", "person": [["Who", "Sholes's daughter. The 1923 book calls her the first woman to work a typewriter"], ["The shift", "In 1874 under 4% of US clerks were women. By 1900 about 75% were"], ["Sholes said", "\"I feel that I have done something for the women who have always had to work so hard\""], ["The school", "The YWCA opened the first typing school in 1881"]], "canvas": [["Play up?", "The black case with painted flowers, next to her stiff 1872 dress"], ["Glue on?", "Lines typed in capitals, inked ribbon, carbon paper"]], "where": {"place": "National Museum of American History", "city": "Washington, DC", "note": "The 1868 patent model, with piano keys, is listed in Inventing in America", "url": "https://www.si.edu/object/nmah_850123"}, "studio": {"work": "You painted Bridgeport Mill", "line": "None of the three inventors was a mechanic. A Milwaukee machine shop built it for them"}, "asks": [["Why QWERTY?", "Usual story: jamming pairs were moved apart. One expert says \"still a little mysterious\""], ["Who bought one early?", "Mark Twain, in Boston in 1874. He called it a \"curiosity breeding little joker\""], ["Why does it look like a sewing machine?", "Remington's William Jenne came from its sewing machine shop. Stand, grapevine legs and treadle came with him"]], "teaser": "a writing machine that gunmakers dressed up like a sewing machine", "also": [["Milwaukee", "Milwaukee Public Museum holds the ASME landmark machine. Its Wells Street building closes January 3, 2027"]], "personCaption": "Sholes's daughter at one of his test machines, 1872. From The Story of the Typewriter, 1923", "imgMachine": "img/typewriter_machine.jpg", "imgPerson": "img/typewriter_person.jpg", "bp": {"img": "img/bp_typewriter.jpg", "cap": "A real one: C. L. Sholes's machine on its treadle stand, US patent 207,559, 1878"}, "svg": ""}, {"id": "wrightflyer", "name": "1903 Wright Flyer", "sub": "Orville and Wilbur Wright, Dayton, 1903", "hook": "The engine was built in six weeks with a lathe, a drill press and no drawings", "trick": "The pilot lies in a hip cradle. Slide your hips and the wings twist, and the rudder moves with them", "facts": [["First flight", "12 seconds, 120 feet, about 8 feet up, December 17, 1903"], ["Engine", "Four cylinders, water cooled, about 170 pounds, 12 hp"], ["Drive", "Sprockets and chain, like a bicycle, to two 8.5 foot props turning opposite ways"], ["Odd detail", "The right wing is 4 inches longer to make up for the engine's weight"]], "photoCaption": "The first flight, 10:35 am, December 17, 1903. Orville flying, Wilbur running. Library of Congress", "toBlueprint": "How do you steer with no ailerons at all?", "parts": [["Launch rail", "Four 15 foot 2x4s laid end to end. No wheels, the sand was too deep"], ["Engine and chains", "Charlie Taylor's 12 hp four turns both props through bicycle style chain"], ["Front elevator", "Two small surfaces out front control pitch. A lever in the left hand works them"], ["Hip cradle", "Shift your hips to warp the wings and swing the rear rudder together"]], "toPerson": "Who built the engine and stayed home?", "personTitle": "The mechanic from Illinois", "person": [["Who", "Charlie Taylor, born in a log cabin in rural Illinois, 1868"], ["The crank", "Cut from a steel slab. He drilled the outline, chiseled the waste, then turned it"], ["The plans", "Sketches on scratch paper, spiked over his bench"], ["The end", "He died poor in Los Angeles in 1956. Mechanics now honor his birthday, May 24"]], "canvas": [["Play up?", "A man lying flat in a white kite, with all that empty sand around him"], ["Glue on?", "Unbleached muslin, spruce shavings, a length of bicycle chain"]], "where": {"place": "Griffin Museum of Science and Industry", "city": "Chicago", "note": "The Spirit of Glen Ellyn, a full scale replica that flew in Bolingbrook in 2003", "url": "https://www.griffinmsi.org/exhibits/transportation-gallery"}, "studio": {"work": "You painted Felt and Trek racing bikes", "line": "The Wrights were bike makers, and the Flyer's props ran on bicycle style chain"}, "asks": [["Did the engine have spark plugs?", "No. Contact points inside each cylinder opened and closed, worked by cams"], ["Was there a carburetor?", "Not really. Gas dripped from a one gallon tank into a warm chamber and mixed with air"], ["Was Taylor at Kitty Hawk?", "No. He stayed in Dayton to mind the bike shop"]], "teaser": "a machine steered by sliding your hips, powered by an engine built in six weeks", "also": [], "personCaption": "Wilbur lying at the controls after the failed try of December 14, 1903. Library of Congress", "imgMachine": "img/wrightflyer_machine.jpg", "imgPerson": "img/wrightflyer_person.jpg", "bp": {"img": "img/bp_wrightflyer.jpg", "cap": "A real one: Fig. 1 of the Wrights' flying machine patent, No. 821,393, filed 1903, granted 1906"}, "svg": ""}, {"id": "plow", "name": "John Deere's steel plow", "sub": "Grand Detour, Illinois, 1837", "hook": "The famous steel plow was mostly wrought iron. The Smithsonian ran the spark test", "trick": "A hard steel edge does the cutting. A polished moldboard gives sticky prairie soil nothing to grip", "facts": [["Share", "Medium-high carbon steel, welded to the front edge"], ["Moldboard", "Wrought iron, just under a quarter inch thick, ground smooth"], ["Output", "10 plows in 1839. 10,000 a year by 1857"], ["Lincoln", "Said of his Gettysburg speech, \"That speech won't scour\". So his bodyguard told it"]], "photoCaption": "Deere's 1838 plow, right side. Smithsonian photo 42639-A, from Edward Kendall's study of the plow", "toBlueprint": "How do you fold a plow from one plate?", "parts": [["Flat plate", "One diamond-shaped piece about 12 inches wide. The shape gave it the name diamond plow"], ["The bend", "Heated and curved. One end becomes the moldboard, the other the landside"], ["Steel share", "A wedge of steel welded on the leading edge, tough enough to stay sharp"], ["Polished face", "Ground smooth so wet soil slides off. Plowmen call that scouring"]], "toPerson": "Who was the blacksmith from Vermont?", "personTitle": "The blacksmith", "person": [["Who", "John Deere, born in Vermont in 1804, trained as a blacksmith's apprentice"], ["The move", "Reached Grand Detour in 1836. Set up as a blacksmith right away"], ["Legend says", "He cut it from a broken sawmill blade. The Smithsonian's curator doubted the saw"], ["Credited with", "\"If we don't improve our product, somebody else will\""]], "canvas": [["Play up?", "The mirror shine of the moldboard against a rough oak beam"], ["Glue on?", "Black prairie soil, a piece of old saw blade, hand-forged nails"]], "where": {"place": "John Deere Historic Site", "city": "Grand Detour, Illinois", "note": "Working blacksmith, Deere's 1836 house, and the dig of his shop. Seasonal, so check dates first", "url": "https://www.deere.com/en/connect-with-john-deere/visit-john-deere/historic-site"}, "studio": {"work": "You painted LeBlond Lathe", "line": "Deere won on surface finish. Any lathe hand knows that fight"}, "asks": [["Why did old plows fail here?", "Prairie soil stuck to the moldboard. Farmers carried a wooden paddle just to scrape it"], ["Did Leonard Andrus design it?", "A rival company's ad man pushed that story. The Smithsonian's curator thought Deere worked it out alone"], ["Where is the 1838 plow?", "It belongs to the Smithsonian's American History Museum in Washington"]], "teaser": "a blacksmith's blade that let sticky prairie soil slide right off", "also": [], "personCaption": "John Deere, undated portrait from an old Cyclopaedia of American Biography. Via Wikimedia Commons", "imgMachine": "img/plow_machine.jpg", "imgPerson": "img/plow_person.jpg", "bp": {"img": "img/bp_plow.jpg", "cap": "A real one: Smithsonian drawings of Deere's cut and bent plate, and the 1838 plow rebuilt"}, "svg": ""}, {"id": "comptometer", "name": "Comptometer", "sub": "Dorr E. Felt, Chicago, 1887", "hook": "The first one was a macaroni box, meat skewers, staples and rubber bands", "trick": "No crank. Pressing a key does the adding, so every finger can work at once", "facts": [["Prototype", "Built from Thanksgiving 1884 to New Year 1885"], ["Patent", "No. 371,496, Oct 11, 1887. Felt was 25"], ["Wood models", "About 6,500 built by 1903. Fewer than 90 are known today"], ["Nickname", "\"The machine gun of the office\" in World War I ads"]], "photoCaption": "Felt's macaroni box prototype as it was handed to the Smithsonian, 1937. Harris & Ewing, Library of Congress", "toBlueprint": "How does a key press turn a wheel?", "parts": [["Keys", "Nine keys per column, 1 to 9. In Fig 1 they stand in a row over one long lever"], ["Lever", "Each column has its own. Press a key and it swings at once, no crank"], ["Number wheel", "The swing adds that digit to the column's wheel. The total shows in a front window"], ["Carry", "Tens pass to the next wheel. A 1904 redesign cut the key force to a quarter"]], "toPerson": "Who builds a calculator from a pasta box?", "personTitle": "The machinist with no money", "person": [["Who", "Dorr E. Felt, born 1862 near Beloit, Wisconsin"], ["Trade", "Went to work in a Beloit machine shop at 16"], ["His backer", "Robert Tarrant gave him a bench in his Chicago shop"], ["Odd pair", "Fishing was said to be the only thing the two partners both liked"]], "canvas": [["Play up?", "Ten fingers down on the keys at once, like a piano chord"], ["Glue on?", "A pasta box panel, wood skewers, staples, rubber bands"]], "where": {"place": "Computer History Museum", "city": "Mountain View, near San Francisco", "note": "Look for the wood cased Comptometers in the calculators part of Revolution", "url": "https://www.computerhistory.org/revolution/calculators/1/55"}, "studio": {"work": "You painted Bridgeport Mill", "line": "Felt came up through a machine shop too, and it shows in every lever"}, "asks": [["Why was it fast?", "A skilled operator pressed all the digits of a number at once"], ["How did it subtract?", "By adding. Small 9's complement numbers sat beside the key digits"], ["How long did it last?", "Made from 1887 to the mid 1970s. A few were still at work in the early 1990s"]], "teaser": "a Chicago adding machine first built from a macaroni box and meat skewers", "also": [["Chicago", "The old factory on N Paulina was turned into lofts. Outside look only"]], "personCaption": "Felt's prototype is presented to the Smithsonian by his family, 1937. Harris & Ewing, Library of Congress", "imgMachine": "img/comptometer_machine.jpg", "imgPerson": "img/comptometer_person.jpg", "bp": {"img": "img/bp_comptometer.jpg", "cap": "A real one: sheet 1 of Dorr Felt's adding machine, US patent 371,496, 1887"}, "svg": ""}, {"id": "jukebox", "name": "Seeburg Select-O-Matic", "sub": "J P Seeburg Corp, Chicago, 1949", "hook": "Seeburg stood the records on edge and played both sides without flipping one", "trick": "Fifty records stand in a row like books. The tonearm stands upright with a needle on each side, so it plays either face", "facts": [["Selections", "100, from 50 records played on both sides"], ["Before it", "Jukeboxes held 10 to 24 selections"], ["Built at", "1500 N Dayton St, by Goose Island"], ["Long life", "Later Seeburgs kept the same basic changer for decades"]], "photoCaption": "A later Seeburg Select-O-Matic with the mechanism hidden behind the front. Wikimedia Commons, released CC0", "toBlueprint": "How do you play side B without a flip?", "parts": [["Record magazine", "Fifty records stand on edge in one straight row"], ["Push out", "The chosen record is pushed forward out of the row"], ["Flywheel turntable", "It clamps the record upright and spins it on edge"], ["Two sided tonearm", "It stands vertical with a stylus on each side. It shifts left or right to pick the side"]], "toPerson": "Who was feeding all those nickels?", "personTitle": "The people at the buttons", "person": [["Who", "Sergeant Williams and friends in the Fort Bragg service club"], ["The founder", "Justus Sjoberg of Gothenburg, Sweden. He spelled it Seeburg and started in 1902"], ["The engineer", "Myron Holbert posed with a 200 selection Seeburg in an April 1948 press photo"], ["The appetite", "By the mid 1940s, three quarters of American records went into jukeboxes"]], "canvas": [["Play up?", "A long row of records on edge, like the teeth of a comb"], ["Glue on?", "Old 45s, title strip cards, a few nickels"]], "where": {"place": "Sanfilippo Estate", "city": "Barrington, Illinois", "note": "Seeburg coin pianos and orchestrions, its trade before jukeboxes. Ticketed events and tours only", "url": "https://www.sanfilippofoundation.org/events.html"}, "studio": {"work": "You painted CNC Metalworking Lathe (2026)", "line": "Punch in a number and the machine fetches the right piece. Seeburg built a tool changer for records"}, "asks": [["When did it come out?", "Sources say 1949 or 1950. Seeburg showed the idea to the press in 1948"], ["What about 45s?", "In 1950 Seeburg built the first commercial jukebox made for 45 rpm records"], ["Did makers like the word jukebox?", "No. It came from juke joints, and makers tried to avoid it"]], "teaser": "a Chicago machine that stood 50 records on edge and played both sides", "also": [["Chicago", "No Seeburg jukebox on public view found. The Made in Chicago Museum owns a Seeburg wall box but has no exhibit open now"]], "personCaption": "Sergeant Williams and friends pick a song at Fort Bragg, March 1942. This box is a Wurlitzer. Arthur Rothstein, FSA/OWI, Library of Congress", "imgMachine": "img/jukebox_machine.jpg", "imgPerson": "img/jukebox_person.jpg", "bp": {"img": "img/bp_jukebox.jpg", "cap": "A real one: a later Seeburg with records on edge, M J H Staar, US patent 2,946,594, 1960"}, "svg": ""}, {"id": "telescope", "name": "100-inch Hooker Telescope", "sub": "Mount Wilson, near Los Angeles, 1917", "hook": "A hundred tons of telescope floats on mercury so a clock can turn it", "trick": "Hollow steel drums float in tanks of mercury at both ends of the polar axis. Nearly all the weight rides on liquid", "facts": [["Mirror", "Glass blank 101 inches across, 13 thick, four and a half tons, cast at St. Gobain, France"], ["Moving weight", "About 100 tons, turned by a clock through a 17 foot worm wheel"], ["Built", "Big sections made at Quincy, Massachusetts, on machines sized for battleships"], ["Record", "Largest telescope in the world from 1917 to 1949"]], "photoCaption": "The 100-inch Hooker telescope in its dome. From George Ellery Hale, The New Heavens, 1922", "toBlueprint": "How do you turn 100 tons like a clock?", "parts": [["Mirror", "Sits at the bottom of the open tube on supports that keep the glass from sagging"], ["Yoke", "English type mount. The tube swings between the arms of a long rectangular frame"], ["Mercury floats", "Steel drums in cast iron tanks carry the yoke. Friction nearly disappears"], ["Driving clock", "Turns the 17 foot worm wheel to cancel the earth's spin and hold a star still"]], "toPerson": "Which astronomer started out driving the mules?", "personTitle": "The mule driver", "person": [["Who", "Milton Humason. He left school after eighth grade"], ["First job", "Driving mule teams that hauled supplies and telescope parts up the mountain"], ["Then", "Janitor in 1917, night assistant, and on the science staff by 1919"], ["With Hubble", "From 1929 to 1936 they measured nearly 140 galaxies and found them moving away"]], "canvas": [["Play up?", "The riveted yoke filling the dome, with small figures climbing on it"], ["Glue on?", "A star chart, foil for the silvered mirror, rivet heads"]], "where": {"place": "Mount Wilson Observatory", "city": "Los Angeles area, California", "note": "Grounds open daily 10 to 5. Tours and public nights at the eyepiece run spring and summer", "url": "https://mtwilson.edu/"}, "studio": {"work": "You painted Konica X-Ray Machine (2026)", "line": "Both are machines built to show what the eye can't see"}, "asks": [["What went wrong on first light?", "Jupiter came out as a mess of overlapping images. After the mirror cooled, Vega was sharp"], ["Any tie to Illinois?", "Edwin Hubble grew up in Wheaton and studied at the University of Chicago"], ["Can you look through it?", "Yes. The observatory sells public ticket nights on the 60-inch and 100-inch"]], "teaser": "a hundred ton instrument that floats on me
